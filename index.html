    const innerR = rAtH + gap;

    if (!pierceTest(b.start, b.end, center, axis, innerR)) { rejPierce++; continue; }
    if (!captureTest(b, h, innerR, childrenMap))           { rejCapture++; continue; }
    const candidate = { center, axis, innerR, tubeR: RING_TUBE_R, branch: b };
    if (!clearanceTest(candidate, branches, gap, childrenMap)) { rejClearance++; continue; }
    rings.push(candidate);
  }

  if (rejPierce || rejCapture || rejClearance) {
    console.log(`ring rejects: pierce=${rejPierce} capture=${rejCapture} clearance=${rejClearance}`);
  }
  return rings;
}

const _ringZ = new THREE.Vector3(0, 0, 1);
function addRingMeshes(rings) {
  for (const r of rings) {
    const geom = new THREE.TorusGeometry(r.innerR + r.tubeR, r.tubeR, 10, 32);
    const mesh = new THREE.Mesh(geom, material);
    mesh.position.copy(r.center);
    mesh.quaternion.setFromUnitVectors(_ringZ, r.axis);
    exportGroup.add(mesh);
  }
}

// ---------- Print-safety gate (Chunk 5b) ----------
// Flood-fills all "outside" voxels (field ≥ iso) from a corner seed; any
// outside-signed voxel the fill can't reach is trapped inside the mesh,
// which a slicer would treat as a non-drainable cavity. For our padded
// bounding box the corner voxel is guaranteed to be outside (field = 1e6).
function floodFillOutside(field, nx, ny, nz, iso) {
  const sZ = nx * ny;
  const N = field.length;
  const seen = new Uint8Array(N);
  const stack = [0];
  seen[0] = 1;
  while (stack.length) {
    const idx = stack.pop();
    const x = idx % nx;
    const zySlab = Math.floor(idx / nx);
    const y = zySlab % ny;
    const z = Math.floor(zySlab / ny);
    if (x > 0)        { const n = idx - 1;  if (!seen[n] && field[n] >= iso) { seen[n] = 1; stack.push(n); } }
    if (x < nx - 1)   { const n = idx + 1;  if (!seen[n] && field[n] >= iso) { seen[n] = 1; stack.push(n); } }
    if (y > 0)        { const n = idx - nx; if (!seen[n] && field[n] >= iso) { seen[n] = 1; stack.push(n); } }
    if (y < ny - 1)   { const n = idx + nx; if (!seen[n] && field[n] >= iso) { seen[n] = 1; stack.push(n); } }
    if (z > 0)        { const n = idx - sZ; if (!seen[n] && field[n] >= iso) { seen[n] = 1; stack.push(n); } }
    if (z < nz - 1)   { const n = idx + sZ; if (!seen[n] && field[n] >= iso) { seen[n] = 1; stack.push(n); } }
  }
  let enclosed = 0;
  for (let i = 0; i < N; i++) if (field[i] >= iso && !seen[i]) enclosed++;
  return enclosed;
}

// Runs cheap pre-export checks against the sampled high-res field.
// Warnings are informational — export proceeds either way. Wall-thickness
// threshold comes from the selected metal preset since each DMLS alloy has
// its own documented minimum printable wall.
function checkPrintSafety(branches, voxel, fieldInfo, materialKey, wall) {
  const mat = MATERIALS[materialKey] || MATERIALS.stainless;
  const warns = [];
  if (voxel > 1.0) warns.push(`voxel=${voxel.toFixed(2)}mm may alias thin features`);
  let minR = Infinity;
  for (const b of branches) { if (b.r0 < minR) minR = b.r0; if (b.r1 < minR) minR = b.r1; }
  if (minR < mat.minWall) warns.push(`min branch radius=${minR.toFixed(2)}mm < ${mat.minWall}mm ${mat.label} wall limit`);
  if (wall > 0) {
    if (wall < mat.minWall) warns.push(`shell wall=${wall.toFixed(2)}mm < ${mat.minWall}mm ${mat.label} wall limit`);
    if (voxel > wall * 0.5) warns.push(`voxel=${voxel.toFixed(2)}mm > wall/2 — shell may alias; reduce Size or disable hollow`);
  }
  return warns;
}

// Separate post-export neg-space clearance check. For N-helix we can compute
// the inter-strand clearance analytically (chord between adjacent strands
// on the wrap circle); colony paths are checked as a coarse voxel shell
// distance instead. Called from downloadSTL after buildField.
function checkNegSpaceSafety(s, branches) {
  if (!s.negStyle || s.negStyle === 'none') return [];
  const mat = MATERIALS[s.material] || MATERIALS.stainless;
  const warns = [];
  const tubeR = negTubeRadius(s);
  if (tubeR < mat.minWall) warns.push(`neg-space tube radius ${tubeR.toFixed(2)}mm < ${mat.minWall}mm ${mat.label} wall limit`);
  if (s.negStyle === 'helix') {
    const box = new THREE.Box3();
    for (const b of branches) box.expandByPoint(b.start).expandByPoint(b.end);
    const size = box.getSize(new THREE.Vector3());
    const perp = Math.min(size.x, size.y, size.z);
    const wrapR = perp * 0.30 * (0.6 + 0.8 * s.negDensity);
    const N = Math.max(1, Math.min(6, s.negStrands | 0));
    const chord = 2 * wrapR * Math.sin(Math.PI / N);
    const wallBetween = chord - 2 * tubeR;
    if (N > 1 && wallBetween < mat.minWall) {
      warns.push(`helix strand-to-strand wall ${wallBetween.toFixed(2)}mm < ${mat.minWall}mm — reduce strand count or density`);
    }
  }
  return warns;
}

// ---------- Printability analysis + auto-fix (Chunk C / v1.13.0) ----------
// Authoritative end-of-pipeline check. Inspects the actual built mesh and
// the active state, returns a structured report of pass/fail per criterion.
// The fail items that are auto-fixable get clamped state values via
// applyAutoFix; the generate() loop then rebuilds and re-analyzes until
// either everything passes or no further fix is possible.
function analyzePrintability(buildResult, rings, s, branches) {
  const mat = MATERIALS[s.material] || MATERIALS.stainless;
  const voxel = buildResult.voxel;
  const nComp = buildResult.nComp;
  const triCount = buildResult.triCount | 0;
  const checks = [];

  // 1. Single connected mesh — the most important printability invariant.
  checks.push({
    name: 'connected',
    pass: nComp === 1,
    autoFix: false,
    label: nComp === 1
      ? 'single connected mesh — no orphan pieces'
      : `${nComp} disconnected pieces — orphans remain after Phase 1+2 repair`,
  });

  // 2. Shell wall thickness.
  if (s.wall > 0) {
    const ok = s.wall + 1e-6 >= mat.minWall;
    checks.push({
      name: 'wall',
      pass: ok,
      autoFix: !ok,
      label: ok
        ? `shell wall ${s.wall.toFixed(2)}mm meets ${mat.label} ${mat.minWall}mm minimum`
        : `shell wall ${s.wall.toFixed(2)}mm is below ${mat.label} ${mat.minWall}mm minimum`,
    });
  } else {
    checks.push({
      name: 'wall',
      pass: true,
      autoFix: false,
      label: 'solid (no shell wall — printable as a fully-solid part)',
    });
  }

  // 3. Branch radii.
  let minR = Infinity;
  for (const b of branches) {
    if (b.r0 < minR) minR = b.r0;
    if (b.r1 < minR) minR = b.r1;
  }
  if (minR === Infinity) minR = mat.minWall;
  const branchOk = minR + 1e-6 >= mat.minWall;
  checks.push({
    name: 'branches',
    pass: branchOk,
    autoFix: false,  // would require regenerating the branch graph
    label: branchOk
      ? `min branch radius ${minR.toFixed(2)}mm meets ${mat.minWall}mm minimum`
      : `min branch radius ${minR.toFixed(2)}mm < ${mat.minWall}mm — increase Core thickness`,
  });

  // 4. Voxel resolution vs wall (preview-quality concern only — the 160³
  // export uses much smaller voxels and resolves any reasonable wall
  // cleanly). severity:'warn' so a preview-alias finding doesn't gate
  // printability; bumping the wall would surprise the user.
  if (s.wall > 0) {
    const ok = voxel <= s.wall + 1e-6;
    checks.push({
      name: 'resolution',
      pass: ok,
      severity: 'warn',
      autoFix: false,
      label: ok
        ? `voxel ${voxel.toFixed(2)}mm ≤ wall — preview resolves cleanly`
        : `voxel ${voxel.toFixed(2)}mm > wall ${s.wall.toFixed(2)}mm — preview may alias (export at 160³ should still resolve)`,
    });
  }

  // 5. Ring tube radii.
  if (rings && rings.length > 0) {
    let minTube = Infinity;
    for (const r of rings) if (r.tubeR < minTube) minTube = r.tubeR;
    const ok = minTube + 1e-6 >= mat.minWall;
    checks.push({
      name: 'rings',
      pass: ok,
      autoFix: false,
      label: ok
        ? `ring tubes ≥ ${mat.minWall}mm — printable interlocked rings`
        : `ring tube ${minTube.toFixed(2)}mm < ${mat.minWall}mm`,
    });
  }

  // 6. Tri count sanity (slicers choke above ~500K).
  const triOk = triCount > 0 && triCount < 500000;
  checks.push({
    name: 'tris',
    pass: triOk,
    autoFix: false,
    label: triCount === 0
      ? 'mesh is empty'
      : triCount < 500000
        ? `${triCount.toLocaleString()} triangles — slicer-friendly`
        : `${triCount.toLocaleString()} triangles — may be slow to slice`,
  });

  // 7. Material printable confirmation.
  checks.push({
    name: 'material',
    pass: true,
    autoFix: false,
    label: `selected process: ${mat.label} (${mat.group === 'metal' ? 'DMLS/SLM' : 'FDM/SLA/SLS'})`,
  });

  // pass is gated on severity:'block' checks only; severity:'warn' items
  // are informational and don't block printability.
  const allPass = checks.every(c => c.pass || c.severity === 'warn');
  return { pass: allPass, checks };
}

// Mutate state to fix auto-fixable check failures. Returns the array of
// human-readable fix descriptions applied; empty array means no progress
// could be made and the loop should stop.
function applyAutoFix(state, checks, voxel) {
  const mat = MATERIALS[state.material] || MATERIALS.stainless;
  const fixes = [];
  for (const c of checks) {
    if (c.pass || !c.autoFix) continue;
    if (c.name === 'wall' && state.wall > 0 && state.wall < mat.minWall) {
      const before = state.wall;
      state.wall = mat.minWall;
      fixes.push(`wall ${before.toFixed(2)}→${state.wall.toFixed(2)}mm (${mat.label} min)`);
    }
  }
  return fixes;
}

function displayPrintReport(report, fixCount) {
  const card = document.getElementById('printReport');
  if (!card) return;
  const statusEl = card.querySelector('.report-status');
  const fixesEl = card.querySelector('.report-fixes');
  const ul = card.querySelector('.report-checks');
  card.classList.remove('report-idle', 'report-pass', 'report-fixed', 'report-fail');
  if (report.pass && fixCount > 0) {
    card.classList.add('report-fixed');
    statusEl.textContent = '✓ Printable (auto-fixed)';
    fixesEl.textContent = `${fixCount} fix${fixCount === 1 ? '' : 'es'} applied`;
  } else if (report.pass) {
    card.classList.add('report-pass');
    statusEl.textContent = '✓ Printable';
    fixesEl.textContent = 'all checks pass';
  } else {
    card.classList.add('report-fail');
    statusEl.textContent = '✗ Not printable';
    const failed = report.checks.filter(c => !c.pass).length;
    fixesEl.textContent = `${failed} issue${failed === 1 ? '' : 's'} unresolved`;
  }
  // Rebuild the checklist
  ul.innerHTML = '';
  for (const c of report.checks) {
    const li = document.createElement('li');
    li.className = c.pass ? 'pass' : 'fail';
    li.textContent = c.label;
    ul.appendChild(li);
  }
}

// ---------- Symmetry (Chunk 5a) ----------
// None: no-op. Bilateral: mirror through the X=0 plane (x → -x). Radial-N:
// N-fold rotation around the Y axis, N ∈ [2,8]. Applied after the branch
// graph is generated but before the SDF field is rasterized, so the
// symmetric copies are fused by the same smooth-min pipeline that handles
// the original body. Rings are mirrored separately after candidate selection
// so that a ring on a primary branch is paired with an identical ring on
// every symmetric copy.
//
// Dedupe: a primitive whose every reference point lies on the symmetry set
// would produce exactly the same primitive when transformed; skip it.
const SYM_EPS = 0.01;                 // mm — "on the plane/axis" threshold

function symTransforms(s) {
  if (s.sym === 'bilateral') return [{ type: 'bilateral' }];
  if (s.sym === 'radial') {
    const N = Math.max(2, Math.min(8, s.radialN | 0));
    const out = [];
    for (let k = 1; k < N; k++) {
      const a = 2 * Math.PI * k / N;
      out.push({ type: 'radial', c: Math.cos(a), sn: Math.sin(a) });
    }
    return out;
  }
  return [];
}

function onSymmetrySet(v, tx) {
  if (tx.type === 'bilateral') return Math.abs(v.x) < SYM_EPS;
  if (tx.type === 'radial')    return Math.abs(v.x) < SYM_EPS && Math.abs(v.z) < SYM_EPS;
  return false;
}

function symVec(v, tx) {
  if (tx.type === 'bilateral') return new THREE.Vector3(-v.x, v.y, v.z);
  if (tx.type === 'radial') {
    return new THREE.Vector3(v.x * tx.c - v.z * tx.sn, v.y, v.x * tx.sn + v.z * tx.c);
  }
  return v.clone();
}

function applySymmetry(branches, accents, s) {
  const txs = symTransforms(s);
  if (txs.length === 0) return { branches, accents };
  const outBranches = branches.slice();
  const outAccents = accents.slice();
  for (const tx of txs) {
    for (const b of branches) {
      if (onSymmetrySet(b.start, tx) && onSymmetrySet(b.end, tx)) continue;
      outBranches.push({
        start: symVec(b.start, tx),
        end: symVec(b.end, tx),
        r0: b.r0, r1: b.r1,
        depth: b.depth,
        parent: b.parent,
        tangent: symVec(b.tangent, tx),
      });
    }
    for (const a of accents) {
      if (onSymmetrySet(a.pos, tx)) continue;
      outAccents.push({
        pos: symVec(a.pos, tx),
        size: a.size,
        axis: symVec(a.axis, tx),
        kind: a.kind,
        spin: a.spin,
      });
    }
  }
  return { branches: outBranches, accents: outAccents };
}

function symmetrizeRings(rings, s) {
  const txs = symTransforms(s);
  if (txs.length === 0) return rings;
  const out = rings.slice();
  for (const tx of txs) {
    for (const r of rings) {
      if (onSymmetrySet(r.center, tx)) continue;
      out.push({
        center: symVec(r.center, tx),
        axis: symVec(r.axis, tx).normalize(),
        innerR: r.innerR,
        tubeR: r.tubeR,
        branch: r.branch,
      });
    }
  }
  return out;
}

// Rescale every primitive in place so the sculpture's max bounding-box
// dimension equals s.size. Applied right after generateStructure so all
// downstream passes (symmetry, field, rings) see already-scaled geometry.
// Radii and ring/tube dimensions scale proportionally — same proportions,
// different overall size.
function scaleStructureToSize(branches, accents, targetMax) {
  const box = new THREE.Box3();
  for (const b of branches) box.expandByPoint(b.start).expandByPoint(b.end);
  for (const a of accents) box.expandByPoint(a.pos);
  const size = box.getSize(new THREE.Vector3());
  const cur = Math.max(size.x, size.y, size.z);
  if (cur < 1e-3) return 1;
  const k = targetMax / cur;
  for (const b of branches) {
    b.start.multiplyScalar(k);
    b.end.multiplyScalar(k);
    b.r0 *= k;
    b.r1 *= k;
  }
  for (const a of accents) {
    a.pos.multiplyScalar(k);
    a.size *= k;
  }
  return k;
}

// Signed-volume sum via the tetrahedron-from-origin trick. Correct for any
// closed oriented triangle mesh; our marching-cubes output is oriented
// outward after the v1.0.1 winding fix. Returns volume in mm³.
function meshVolume(geom) {
  const pos = geom.getAttribute('position').array;
  const idx = geom.getIndex().array;
  let v6 = 0;
  for (let i = 0; i < idx.length; i += 3) {
    const a = idx[i]*3, b = idx[i+1]*3, c = idx[i+2]*3;
    const ax = pos[a],   ay = pos[a+1], az = pos[a+2];
    const bx = pos[b],   by = pos[b+1], bz = pos[b+2];
    const cx = pos[c],   cy = pos[c+1], cz = pos[c+2];
    v6 += ax * (by*cz - bz*cy) + ay * (bz*cx - bx*cz) + az * (bx*cy - by*cx);
  }
  return Math.abs(v6) / 6;
}

// Exact torus volume: 2π² · R · r².
function torusVolume(R, r) { return 2 * Math.PI * Math.PI * R * r * r; }

function formatCost(mat, volumeMM3) {
  const mass_g = volumeMM3 * mat.density;
  const cost = mass_g * mat.cost;
  const massStr = mass_g < 10 ? mass_g.toFixed(1) : Math.round(mass_g);
  const costStr = cost < 10 ? cost.toFixed(2) : cost < 1000 ? Math.round(cost) : (cost/1000).toFixed(1)+'k';
  return `${massStr}g · $${costStr}`;
}

async function generate(previewVoxels = 96) {
  const myToken = ++genToken;
  setBusy(true);
  showProgress(true, previewVoxels < 96 ? `generating @ ${previewVoxels}³…` : 'building structure…');
  setStatus(previewVoxels < 96 ? `generating @ ${previewVoxels}³…` : 'generating…');
  await yieldFrame();
  if (myToken !== genToken) return;

  const t0 = performance.now();
  const { branches: rawBranches, accents: rawAccents } = generateStructure(state);
  scaleStructureToSize(rawBranches, rawAccents, state.size);
  const { branches, accents } = applySymmetry(rawBranches, rawAccents, state);

  // Phase 0 (Chunk B / v1.15.0): show the structural skeleton in the
  // canvas before the SDF rasterization runs. Gives the user something
  // visible to anchor on while the field builds, and reveals the
  // branching structure that gets thickened into the body.
  setProgress(`rasterizing ${branches.length} branches into the SDF…`);
  clearExport();
  exportGroup.add(buildSkeletonMesh(branches));
  await yieldFrame();
  if (myToken !== genToken) return;

  setProgress('marching cubes…');
  await yieldFrame();
  if (myToken !== genToken) return;

  // onPhase callback drives the in-canvas live preview. Each call swaps
  // the previous in-progress mesh out and the new one in, then yields a
  // frame so the user actually sees the change.
  const onPhase = async (label, previewMesh) => {
    if (myToken !== genToken) { previewMesh.geometry.dispose(); return; }
    setProgress(label);
    clearExport();
    exportGroup.add(previewMesh);
    await yieldFrame();
  };

  let result = await buildBodyMesh(branches, accents, state, previewVoxels, myToken, onPhase);
  if (myToken !== genToken) return;
  if (!result) return;
  let { mesh, triCount, voxel, nComp, bridges } = result;

  // Rings (independent of wall thickness — same across auto-fix iterations).
  setProgress('rings & accents…');
  await yieldFrame();
  if (myToken !== genToken) return;
  const ringRng = mulberry32((state.seed >>> 0) ^ 0x7a5529c1);
  const rawRings = generateRings(rawBranches, state, ringRng);
  const rings = symmetrizeRings(rawRings, state);

  // Printability analysis + auto-fix loop (Chunk C / v1.13.0). Inspects the
  // built mesh against the active material's print rules and the connectivity
  // result; if any auto-fixable issue is found, applies the fix to state,
  // rebuilds, and re-analyzes. Up to 3 iterations. Loop exits as soon as
  // every check passes or no further fix is possible.
  setProgress('printability check…');
  await yieldFrame();
  if (myToken !== genToken) return;
  let report = analyzePrintability(result, rings, state, branches);
  let fixCount = 0;
  const MAX_FIX = 3;
  while (!report.pass && fixCount < MAX_FIX) {
    const fixes = applyAutoFix(state, report.checks, voxel);
    if (fixes.length === 0) break;  // nothing further is auto-fixable
    // Sync the wall slider so the user sees their adjusted value.
    if (bindings.wall) {
      bindings.wall.el.value = String(state.wall.toFixed(1));
      bindings.wall.update();
    }
    setProgress(`auto-fix #${fixCount+1}: ${fixes.join(', ')}…`);
    await yieldFrame();
    if (myToken !== genToken) return;
    const reb = await buildBodyMesh(branches, accents, state, previewVoxels, myToken, onPhase);
    if (myToken !== genToken) return;
    if (!reb) return;
    result = reb;
    ({ mesh, triCount, voxel, nComp, bridges } = reb);
    fixCount++;
    report = analyzePrintability(reb, rings, state, branches);
  }
  displayPrintReport(report, fixCount);

  // Mesh is ready — only NOW swap out the previous render. The user sees
  // the previous sculpture the whole time the new one is computing,
  // rather than a brief blank canvas.
  clearExport();
  if (mesh) exportGroup.add(mesh);
  addRingMeshes(rings);

  // Mass + cost readout. Body volume comes from the preview mesh via the
  // divergence trick; ring volumes via exact torus formula. Preview uses
  // the 96³ (or 64³ during drag) field so numbers are approximate —
  // within a few percent on typical sculptures.
  const bodyVol = mesh ? meshVolume(mesh.geometry) : 0;
  let ringVol = 0;
  for (const r of rings) ringVol += torusVolume(r.innerR + r.tubeR, r.tubeR);
  const totalVol = bodyVol + ringVol;
  const mat = MATERIALS[state.material] || MATERIALS.stainless;
  document.getElementById('costReadout').textContent = formatCost(mat, totalVol);

  // Rulers reflect the actual rendered bounding box (includes rings).
  updateRulers();

  const dt = (performance.now() - t0) | 0;
  frameCamera();
  const hollowTag = state.wall > 0 ? ` wall=${state.wall.toFixed(1)}mm` : '';
  const negTag = state.negStyle !== 'none' ? ` neg=${state.negStyle}(${state.negStrands}@${state.negDensity.toFixed(2)})` : '';
  console.log(`gen: seed=${state.seed} size=${state.size}mm${hollowTag}${negTag} sym=${state.sym}${state.sym === 'radial' ? state.radialN : ''} ${branches.length}br ${accents.length}ac ${rings.length}rg ${triCount|0}tri voxel=${voxel.toFixed(2)}mm components=${nComp} bridges=${bridges} ${dt}ms`);
  const warn = nComp > 1 ? ` · ⚠ ${nComp} shells` : '';
  setStatus(`seed ${state.seed} · ${triCount|0} tris · ${rings.length} rings${warn}`);
  // Only release busy + progress state when (a) we're still the freshest
  // generate (no newer one took over) and (b) no further regen is pending.
  // During continuous slider drag the fast pass finishes before the full
  // pass schedules; keeping busy on through both prevents spinner flicker.
  if (myToken === genToken && !fastScheduled && !fullTimer) {
    setBusy(false);
    showProgress(false);
  }
}

function frameCamera() {
  const box = new THREE.Box3().setFromObject(exportGroup);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.75;
  controls.target.copy(center);
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(center).addScaledVector(dir, radius * 3.0);
  camera.near = Math.max(0.1, radius * 0.05);
  camera.far = radius * 40;
  camera.updateProjectionMatrix();
  controls.update();
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }
function setBusy(on) { document.getElementById('statusBox').classList.toggle('busy', !!on); }

// Big progress overlay — visible by default during async generate phases.
function setProgress(text) {
  const el = document.getElementById('progressText');
  if (el && text != null) el.textContent = text;
}
function showProgress(on, text) {
  const overlay = document.getElementById('progressOverlay');
  if (text != null) setProgress(text);
  if (overlay) overlay.classList.toggle('active', !!on);
}

// Yield to the browser so the overlay can paint between blocking phases.
// setTimeout(0) is more reliable than rAF when the previous frame already
// fired — both patterns are used here for redundancy.
function yieldFrame() { return new Promise(r => setTimeout(r, 0)); }

// Generation token. Each generate() invocation increments this and stores
// its own copy; at every yield point it checks whether a newer generate
// has started and bails if so. Prevents two stale async generates from
// stepping on each other's exportGroup updates during continuous slider
// drag.
let genToken = 0;

// ---------- STL export (Chunk 5b) ----------
// Rebuilds the body mesh at a higher voxel resolution (EXPORT_VOXELS),
// runs the print-safety gate, then writes the binary STL. Progress is
// communicated via setStatus() between phases, each yielding a frame
// so the DOM actually paints before the next blocking phase starts.
// The <a> is created synchronously inside the click handler so the
// iOS Safari download gesture is preserved; .click() fires after the
// blob is ready via the same anchor reference.
const exporter = new STLExporter();
const EXPORT_VOXELS = 160;
const nextFrame = () => new Promise(r => requestAnimationFrame(r));

async function downloadSTL() {
  const a = document.createElement('a');
  document.body.appendChild(a);
  let highResGroup = null;
  setBusy(true);
  showProgress(true, `exporting: building ${EXPORT_VOXELS}³ field…`);
  try {
    setStatus(`exporting: building ${EXPORT_VOXELS}³ field…`);
    await nextFrame();

    const { branches: rawB, accents: rawA } = generateStructure(state);
    scaleStructureToSize(rawB, rawA, state.size);
    const { branches, accents } = applySymmetry(rawB, rawA, state);
    const f = buildField(branches, accents, state, EXPORT_VOXELS);

    setStatus('exporting: marching cubes…');
    setProgress('exporting: marching cubes…');
    await nextFrame();
    let geom = marchingCubes(f.field, f.nx, f.ny, f.nz, f.ox, f.oy, f.oz, f.voxel, 0);
    if (geom.getAttribute('position').count === 0) {
      setStatus('export failed: empty mesh');
      a.remove();
      return;
    }
    geom = mergeVertices(geom, 1e-4);
    geom.computeVertexNormals();
    const bodyMesh = new THREE.Mesh(geom, material);

    setStatus('exporting: safety check…');
    setProgress('exporting: safety check…');
    await nextFrame();
    const warns = checkPrintSafety(branches, f.voxel, f, state.material, state.wall)
      .concat(checkNegSpaceSafety(state, branches));
    if (warns.length) {
      console.warn('print-safety warnings:');
      for (const w of warns) console.warn('  ·', w);
    }

    setStatus('exporting: writing STL…');
    setProgress('exporting: writing STL…');
    await nextFrame();
    highResGroup = new THREE.Group();
    highResGroup.add(bodyMesh);
    const ringRng = mulberry32((state.seed >>> 0) ^ 0x7a5529c1);
    const rings = symmetrizeRings(generateRings(rawB, state, ringRng), state);
    for (const r of rings) {
      const rg = new THREE.TorusGeometry(r.innerR + r.tubeR, r.tubeR, 10, 32);
      const rm = new THREE.Mesh(rg, material);
      rm.position.copy(r.center);
      rm.quaternion.setFromUnitVectors(_ringZ, r.axis);
      highResGroup.add(rm);
    }
    const stl = exporter.parse(highResGroup, { binary: true });
    const blob = new Blob([stl], { type: 'model/stl' });
    const url = URL.createObjectURL(blob);
    const matSlug = (MATERIALS[state.material] || MATERIALS.stainless).slug;
    a.href = url;
    a.download = `sculpture_${matSlug}_seed${state.seed}_${VERSION}.stl`;
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);

    const warnLabel = warns.length ? ` · ⚠ ${warns.length}` : '';
    setStatus(`exported seed ${state.seed} @ ${EXPORT_VOXELS}³${warnLabel}`);
  } catch (e) {
    console.error(e);
    setStatus('export failed');
    a.remove();
  } finally {
    // Free the high-res geometry so iPhone doesn't hold two copies in memory.
    if (highResGroup) {
      for (const child of highResGroup.children) if (child.geometry) child.geometry.dispose();
    }
    setBusy(false);
    showProgress(false);
  }
}

// ---------- UI wiring ----------
function bindSlider(id, key, format = v => v) {
  const el = document.getElementById(id);
  const out = document.getElementById(id + 'Val');
  const isNum = el.type === 'range' || el.type === 'number';
  const update = () => {
    const v = isNum ? Number(el.value) : el.value;
    state[key] = v;
    if (out) out.textContent = format(v);
  };
  el.addEventListener('input', () => { update(); scheduleRegen(); });
  el.addEventListener('change', () => { update(); scheduleRegen(); });
  return { el, update };
}

function bindSelect(id, key, onChange) {
  const el = document.getElementById(id);
  const update = () => { state[key] = el.value; };
  el.addEventListener('change', () => {
    update();
    if (onChange) onChange();
    scheduleRegen();
  });
  return { el, update };
}

const bindings = {
  seed: bindSlider('seed', 'seed', v => v),
  size: bindSlider('size', 'size', v => v),
  wall: bindSlider('wall', 'wall', v => v.toFixed(1)),
  complexity: bindSlider('complexity', 'complexity', v => v),
  branchCount: bindSlider('branchCount', 'branchCount', v => v),
  branchAngle: bindSlider('branchAngle', 'branchAngle', v => v),
  taper: bindSlider('taper', 'taper', v => v.toFixed(2)),
  trunk: bindSlider('trunk', 'trunk', v => v.toFixed(1)),
  smooth: bindSlider('smooth', 'smooth', v => v.toFixed(2)),
  poly: bindSlider('poly', 'poly', v => v.toFixed(2)),
  rings: bindSlider('rings', 'rings', v => v),
  ringGap: bindSlider('ringGap', 'ringGap', v => v.toFixed(2)),
  radialN: bindSlider('radialN', 'radialN', v => v),
  neg: bindSlider('neg', 'neg', v => v.toFixed(1)),
  negStrands: bindSlider('negStrands', 'negStrands', v => v),
  negDensity: bindSlider('negDensity', 'negDensity', v => v.toFixed(2)),
  innerLinks: bindSlider('innerLinks', 'innerLinks', v => v),
  sym: bindSelect('sym', 'sym', onSymChange),
  negStyle: bindSelect('negStyle', 'negStyle', onNegChange),
};

function onSymChange() {
  document.getElementById('radialWrap').classList.toggle('hidden', state.sym !== 'radial');
}
function onNegChange() {
  const hide = state.negStyle === 'none';
  document.getElementById('negStrandsWrap').classList.toggle('hidden', hide);
  document.getElementById('negDensityWrap').classList.toggle('hidden', hide);
}
onSymChange();
onNegChange();

// Material dropdown binds separately: changing it updates the shared
// material tint and, if the current wall thickness is below the new
// alloy's minimum printable wall, bumps wall up to that floor (and
// triggers a regen since the geometry changes).
const materialEl = document.getElementById('material');
materialEl.addEventListener('change', () => {
  state.material = materialEl.value;
  applyMaterial(state.material);
  const newMin = (MATERIALS[state.material] || MATERIALS.stainless).minWall;
  if (state.wall > 0 && state.wall < newMin) {
    state.wall = newMin;
    bindings.wall.el.value = String(newMin);
    bindings.wall.update();
    scheduleRegen();
  }
});

function refreshUIFromState() {
  for (const k of Object.keys(bindings)) {
    const b = bindings[k];
    if (b.el.type === 'range' || b.el.type === 'number') b.el.value = String(state[k]);
    else b.el.value = state[k];
    b.update();
  }
  onSymChange();
  onNegChange();
  materialEl.value = state.material;
  applyMaterial(state.material);
}

// Dual-phase regen (Chunk 6). Fast 64³ preview fires at most every 30ms
// during continuous slider drag — gives ~30fps interactive feedback with
// less voxel detail. Full 96³ pass fires 300ms after the last input event,
// delivering the crisp final when the drag settles. Both phases share the
// same seed+state, so the only visible difference is surface resolution.
let fastScheduled = false, fullTimer = null;
function scheduleRegen() {
  // Light up the spinner immediately so the user sees feedback even though
  // the actual generate() will block the main thread for ~50–500ms. The
  // rAF wrap ensures the browser gets one paint cycle to render the busy
  // state before generate() starts blocking.
  setBusy(true);
  if (!fastScheduled) {
    fastScheduled = true;
    setTimeout(() => {
      fastScheduled = false;
      requestAnimationFrame(() => generate(64));
    }, 30);
  }
  if (fullTimer) clearTimeout(fullTimer);
  fullTimer = setTimeout(() => {
    fullTimer = null;
    requestAnimationFrame(() => generate(96));
  }, 300);
}

// Buttons
document.getElementById('seedDice').addEventListener('click', () => {
  state.seed = Math.floor(Math.random() * 2 ** 31);
  bindings.seed.el.value = String(state.seed);
  bindings.seed.update();
  scheduleRegen();
});

document.getElementById('newBtn').addEventListener('click', () => {
  // Roll a new seed and randomize creative sliders; keep safety / symmetry alone.
  state.seed = Math.floor(Math.random() * 2 ** 31);
  state.complexity = 3 + Math.floor(Math.random() * 4);        // 3..6
  state.branchCount = 2 + Math.floor(Math.random() * 3);       // 2..4
  state.branchAngle = 20 + Math.floor(Math.random() * 50);     // 20..70
  state.taper = 0.50 + Math.random() * 0.25;                   // 0.50..0.75
  state.trunk = 3 + Math.random() * 5;                         // 3..8
  state.smooth = 0.10 + Math.random() * 0.30;                  // 0.10..0.40
  state.poly = Math.random();                                  // 0..1
  state.rings = Math.floor(Math.random() * 5);                 // 0..4
  refreshUIFromState();
  scheduleRegen();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  Object.assign(state, DEFAULTS);
  refreshUIFromState();
  scheduleRegen();
});

document.getElementById('stlBtn').addEventListener('click', () => {
  // Must stay synchronous to the user gesture for iOS Safari.
  downloadSTL();
});

// Bottom-sheet collapse on narrow screens
const panel = document.getElementById('panel');
document.getElementById('sheetHandle').addEventListener('click', () => {
  panel.classList.toggle('collapsed');
});

// Printability report card expand/collapse on click.
const printReportEl = document.getElementById('printReport');
if (printReportEl) {
  printReportEl.addEventListener('click', () => {
    printReportEl.classList.toggle('expanded');
  });
  printReportEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      printReportEl.classList.toggle('expanded');
    }
  });
}

// Prevent iOS double-tap zoom on UI buttons
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });

// WebGL context loss (Chunk 6). iOS Safari backgrounds discard the GL
// context; on restore we rebuild the mesh so three.js re-uploads fresh
// geometry/normals to the new context on next render. Preventing the
// default on "lost" suppresses Safari's "WebGL crashed" banner.
canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  console.warn('webgl context lost');
  setStatus('gl context lost');
}, false);
canvas.addEventListener('webglcontextrestored', () => {
  console.log('webgl context restored — rebuilding geometry');
  setStatus('gl restored');
  generate();
}, false);

// Initial render. The overlay is lit synchronously so users see feedback
// the moment the page paints, even before generate() yields its first frame.
refreshUIFromState();
showProgress(true, 'preparing first creature…');
generate();
</script>
</body>
</html>
