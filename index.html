<!doctype html>
<!--
  Fractal Sculpture Generator — v1.x
  Single-file web app. Target: iPhone Safari + desktop. Export STL for
  metal (DMLS/SLM) or plastic (FDM/SLA/SLS) printing. Units: millimetres.

  Deploy to GitHub Pages:
    1. Commit index.html to the branch configured as the Pages source
       (repo Settings → Pages → Build and deployment → Branch).
    2. GitHub serves it at https://<user>.github.io/<repo>/.
    3. No build step: everything is inline + ES-module imports from
       https://unpkg.com/three@0.160.0/. CDN fetched on first load.

  Pipeline (see § comments inline):
    generateStructure  Chunk 2  seeded branch graph, phyllotaxis,
                                gravitropism, self-intersection repulsion
    applySymmetry      Chunk 5a bilateral / radial-N with plane/axis dedupe
    buildField         Chunk 3c scatter-rasterize SDF into Float32Array
    marchingCubes      Chunk 3b custom MC walker w/ inline tables
    mergeVertices      three.js weld verts within 1e-4
    countComponents    Chunk 3d union-find — auto-bridge up to 3 retries
    generateRings      Chunk 4  candidate pierce + capture + clearance
    checkPrintSafety   Chunk 5b flood-fill enclosed-void detection

  Development:
    Every artifact lives in this file. No bundler, no build. Open
    with any static server (or just file://) to test. Same seed +
    same sliders always produce the same sculpture.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Fractal Sculpture</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14181d;
    --panel-2: #1b2026;
    --ink: #e8ecf1;
    --ink-dim: #8a94a3;
    --accent: #7bd389;
    --accent-2: #5aa7ff;
    --danger: #ff6b6b;
    --border: #242a31;
    --panel-w: 320px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  button, input, select { font: inherit; color: inherit; }

  #app {
    position: fixed; inset: 0;
    display: grid;
    grid-template-columns: var(--panel-w) 1fr;
    grid-template-rows: 1fr;
  }

  #stage {
    position: relative;
    background: radial-gradient(ellipse at 50% 40%, #1a2028 0%, #0b0d10 70%);
    min-width: 0; min-height: 0;
  }
  #canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none;
  }
  #topbar {
    position: absolute; top: calc(8px + var(--safe-top)); left: 8px; right: 8px;
    display: flex; gap: 8px; align-items: center;
    pointer-events: none; z-index: 10;
  }
  #topbar > * { pointer-events: auto; }
  #newBtn {
    flex: 1 1 auto;
    background: linear-gradient(180deg, #2f7d3a, #1f5a27);
    color: #fff; font-weight: 700; letter-spacing: 0.02em;
    border: 1px solid #3a9a47; border-radius: 10px;
    padding: 12px 14px; font-size: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #newBtn:active { transform: translateY(1px); }
  .icon-btn {
    background: rgba(20,24,29,0.85);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--ink); padding: 10px 12px; font-size: 14px;
    cursor: pointer; white-space: nowrap;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .icon-btn:active { background: #232a32; }
  #stlBtn { color: var(--accent-2); border-color: #2a4a70; }

  #panel {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
    padding-top: var(--safe-top);
  }
  #panelHeader {
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; justify-content: space-between;
  }
  #panelHeader h1 {
    margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--ink-dim);
  }
  #panelBody {
    overflow-y: auto; overflow-x: hidden;
    padding: 10px 14px 16px;
    flex: 1 1 auto;
    -webkit-overflow-scrolling: touch;
  }
  .ctrl { margin: 10px 0 12px; }
  .ctrl > label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--ink-dim); margin-bottom: 4px;
    letter-spacing: 0.02em;
  }
  .ctrl .val { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 12px; }
  .ctrl input[type="range"] {
    width: 100%; height: 28px; background: transparent; margin: 0;
    -webkit-appearance: none; appearance: none;
  }
  .ctrl input[type="range"]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px; background: #2a323b;
  }
  .ctrl input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); border: none; margin-top: -9px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .ctrl input[type="range"]::-moz-range-track {
    height: 4px; border-radius: 2px; background: #2a323b;
  }
  .ctrl input[type="range"]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); border: none;
  }
  .ctrl select, .ctrl input[type="number"] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; color: var(--ink);
  }
  .row { display: flex; gap: 6px; align-items: center; }
  .row input[type="number"] { flex: 1; }
  .dice {
    flex: 0 0 auto; width: 36px; height: 36px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer; color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .dice:active { background: #232a32; }
  .hidden { display: none !important; }

  #panelFooter {
    border-top: 1px solid var(--border);
    padding: 8px 14px calc(8px + var(--safe-bot));
    display: flex; align-items: center; justify-content: space-between;
    color: var(--ink-dim); font-size: 11px; letter-spacing: 0.04em;
    background: var(--panel);
  }
  #version { font-variant-numeric: tabular-nums; }
  #status { color: var(--ink-dim); }

  /* Busy spinner — shown while a generation or export is running.
     Driven on the compositor (CSS rotation) so it animates even when
     the main thread is briefly blocked by SDF/MC work. */
  #statusBox { display: inline-flex; align-items: center; gap: 6px; }
  .busy-dot {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    border-right-color: var(--accent);
    border-radius: 50%;
    opacity: 0;
    animation: spin 0.7s linear infinite;
    transition: opacity 0.15s ease;
  }
  #statusBox.busy .busy-dot { opacity: 1; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* Printability report (Chunk C / v1.13.0). Compact card between the
     panel header and the slider list. Single-line summary by default;
     click the card to expand the per-check list. */
  #printReport {
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    font-size: 11px;
    letter-spacing: 0.02em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .report-summary {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .report-status {
    font-weight: 600; text-transform: uppercase; flex: 0 0 auto;
  }
  .report-fixes {
    color: var(--ink-dim); font-size: 10px; text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #printReport.report-pass  .report-status { color: var(--accent); }
  #printReport.report-fixed .report-status { color: #f0a040; }
  #printReport.report-fail  .report-status { color: var(--danger); }
  #printReport.report-idle  .report-status { color: var(--ink-dim); }
  .report-checks {
    list-style: none; margin: 6px 0 0 0; padding: 0;
    display: none;
  }
  #printReport.expanded .report-checks { display: block; }
  .report-checks li {
    padding: 2px 0;
    color: var(--ink-dim);
    line-height: 1.35;
  }
  .report-checks li.pass::before  { content: "✓ "; color: var(--accent); font-weight: 700; }
  .report-checks li.fail::before  { content: "✗ "; color: var(--danger); font-weight: 700; }
  .report-checks li.fixed::before { content: "⚙ "; color: #f0a040; font-weight: 700; }

  /* Big progress overlay (Chunk A / v1.11.0). Sits on top of the canvas
     during heavy synchronous work so the user has unmissable feedback,
     not just the small panel-header dot. CSS animation runs on the
     compositor thread so it keeps spinning even when the main thread
     is briefly blocked by SDF rasterization or marching cubes. */
  #progressOverlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(11,13,16,0.55);
    pointer-events: none; opacity: 0;
    transition: opacity 0.18s ease;
    z-index: 8;
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }
  #progressOverlay.active { opacity: 1; }
  #progressInner {
    background: rgba(20,24,29,0.95);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 22px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    min-width: 180px; max-width: 80%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  #progressSpinner {
    width: 32px; height: 32px;
    border: 3px solid #2a323b;
    border-top-color: var(--accent);
    border-right-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  #progressText {
    color: var(--ink); font-size: 13px; line-height: 1.3;
    text-align: center; font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  /* Drag handle only visible on mobile sheet */
  #sheetHandle { display: none; }

  /* Narrow: bottom sheet */
  @media (max-width: 720px) {
    #app {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr auto;
    }
    /* HTML order is panel→stage, but on mobile we want canvas on top
       (greedy 1fr row) and panel as a bottom sheet (auto row, capped
       by max-height). Without explicit grid-row assignments the panel
       lands in row 1 and devours the viewport. */
    #stage { grid-row: 1; }
    #panel {
      grid-row: 2;
      border-right: none;
      border-top: 1px solid var(--border);
      max-height: 40vh;
      min-height: 44px;
      transition: max-height 220ms ease;
      padding-top: 0;
    }
    #panel.collapsed { max-height: 64px; }
    #panel.collapsed #panelBody { opacity: 0; pointer-events: none; }
    #sheetHandle {
      display: flex; align-items: center; justify-content: center;
      height: 22px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #sheetHandle::before {
      content: ""; width: 44px; height: 4px; border-radius: 2px;
      background: #3a424c;
    }
    #panelHeader h1 { font-size: 12px; }
    #topbar { top: calc(8px + var(--safe-top)); }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="panel" aria-label="Controls">
    <div id="sheetHandle" aria-label="Toggle controls" role="button" tabindex="0"></div>
    <div id="panelHeader">
      <h1>Sculpture</h1>
      <span id="statusBox"><span class="busy-dot"></span><span id="status">ready</span></span>
    </div>
    <div id="printReport" class="report-idle expanded" role="button" tabindex="0" aria-label="Printability report (click to collapse)">
      <div class="report-summary">
        <span class="report-status">— awaiting first generation</span>
        <span class="report-fixes"></span>
      </div>
      <ul class="report-checks"></ul>
    </div>
    <div id="panelBody">
      <div class="ctrl">
        <label>Seed <span class="val" id="seedVal">—</span></label>
        <div class="row">
          <input type="number" id="seed" min="0" max="4294967295" step="1" value="1">
          <button class="dice" id="seedDice" title="Randomize seed" aria-label="Randomize seed">&#9861;</button>
        </div>
      </div>

      <div class="ctrl">
        <label>Material</label>
        <select id="material">
          <optgroup label="Metals (DMLS / SLM)">
            <option value="stainless">Stainless Steel (316L)</option>
            <option value="titanium">Titanium (Ti-6Al-4V)</option>
            <option value="aluminum">Aluminum (AlSi10Mg)</option>
            <option value="inconel">Inconel 718</option>
            <option value="cocr">Cobalt-Chrome</option>
            <option value="bronze">Bronze</option>
            <option value="copper">Copper (CuCr1Zr)</option>
          </optgroup>
          <optgroup label="Plastics (FDM / SLA / SLS)">
            <option value="pla">PLA (FDM)</option>
            <option value="petg">PETG (FDM)</option>
            <option value="abs">ABS (FDM)</option>
            <option value="nylon">Nylon PA12 (SLS)</option>
            <option value="resin">Resin (SLA)</option>
          </optgroup>
        </select>
      </div>

      <div class="ctrl">
        <label>Size (mm) <span class="val" id="sizeVal">80</span></label>
        <input type="range" id="size" min="40" max="200" step="1" value="80">
      </div>

      <div class="ctrl">
        <label>Wall thickness (mm) <span class="val" id="wallVal">1.0</span></label>
        <input type="range" id="wall" min="0" max="5" step="0.1" value="1.0">
      </div>

      <div class="ctrl">
        <label>Inner links <span class="val" id="innerLinksVal">2</span></label>
        <input type="range" id="innerLinks" min="0" max="12" step="1" value="2">
      </div>

      <div class="ctrl">
        <label>Negative space</label>
        <select id="negStyle">
          <option value="none">None</option>
          <option value="helix" selected>N-Helix (DNA-like spiral)</option>
          <option value="colony">Colony pathways</option>
        </select>
      </div>
      <div class="ctrl" id="negStrandsWrap">
        <label>Strands <span class="val" id="negStrandsVal">3</span></label>
        <input type="range" id="negStrands" min="1" max="6" step="1" value="3">
      </div>
      <div class="ctrl" id="negDensityWrap">
        <label>Negative-space density <span class="val" id="negDensityVal">0.50</span></label>
        <input type="range" id="negDensity" min="0" max="1" step="0.05" value="0.5">
      </div>

      <div class="ctrl">
        <label>Complexity <span class="val" id="complexityVal">4</span></label>
        <input type="range" id="complexity" min="1" max="7" step="1" value="4">
      </div>
      <div class="ctrl">
        <label>Branches / node <span class="val" id="branchCountVal">3</span></label>
        <input type="range" id="branchCount" min="1" max="5" step="1" value="3">
      </div>
      <div class="ctrl">
        <label>Branch angle (°) <span class="val" id="branchAngleVal">35</span></label>
        <input type="range" id="branchAngle" min="10" max="80" step="1" value="35">
      </div>
      <div class="ctrl">
        <label>Radius taper <span class="val" id="taperVal">0.60</span></label>
        <input type="range" id="taper" min="0.4" max="0.95" step="0.01" value="0.60">
      </div>
      <div class="ctrl">
        <label>Core thickness (mm) <span class="val" id="trunkVal">6.0</span></label>
        <input type="range" id="trunk" min="2" max="14" step="0.1" value="6">
      </div>
      <div class="ctrl">
        <label>Smoothness <span class="val" id="smoothVal">0.25</span></label>
        <input type="range" id="smooth" min="0" max="1" step="0.01" value="0.25">
      </div>
      <div class="ctrl">
        <label>Polyhedral accents <span class="val" id="polyVal">0.4</span></label>
        <input type="range" id="poly" min="0" max="1" step="0.01" value="0.4">
      </div>
      <div class="ctrl">
        <label>Rings <span class="val" id="ringsVal">2</span></label>
        <input type="range" id="rings" min="0" max="6" step="1" value="2">
      </div>
      <div class="ctrl">
        <label>Ring tightness (mm) <span class="val" id="ringGapVal">0.7</span></label>
        <input type="range" id="ringGap" min="0.5" max="2.5" step="0.05" value="0.7">
      </div>
      <div class="ctrl">
        <label>Symmetry</label>
        <select id="sym">
          <option value="none">None</option>
          <option value="bilateral">Bilateral</option>
          <option value="radial" selected>Radial N-fold</option>
        </select>
      </div>
      <div class="ctrl" id="radialWrap">
        <label>Radial N <span class="val" id="radialNVal">5</span></label>
        <input type="range" id="radialN" min="2" max="8" step="1" value="5">
      </div>
      <div class="ctrl">
        <label>Min negative space (mm) <span class="val" id="negVal">1.5</span></label>
        <input type="range" id="neg" min="0.5" max="5" step="0.1" value="1.5">
      </div>
    </div>
    <div id="panelFooter">
      <!-- Hardcoded version is rendered immediately on page load — must match VERSION const in the module script. -->
      <span id="version">v1.15.0</span>
      <span id="costReadout" title="Estimated mass and print cost for the selected material">—</span>
    </div>
  </aside>

  <main id="stage">
    <div id="topbar">
      <button id="newBtn" aria-label="New Creature">&#10022; New Creature</button>
      <button class="icon-btn" id="stlBtn" aria-label="Download STL">STL</button>
      <button class="icon-btn" id="resetBtn" aria-label="Reset">Reset</button>
    </div>
    <canvas id="canvas"></canvas>
    <div id="progressOverlay" aria-live="polite">
      <div id="progressInner">
        <div id="progressSpinner"></div>
        <div id="progressText">Working…</div>
      </div>
    </div>
  </main>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// Keep this in sync with the hardcoded version string in #version
// in the panel-footer markup below — the HTML uses it before the ES
// module finishes loading so the footer never shows a stale value.
const VERSION = "v1.15.0";
document.getElementById('version').textContent = VERSION;

// ---------- State ----------
// Printable materials covering DMLS/SLM metal and FDM/SLA/SLS plastic.
//   color/metalness/roughness  preview tint
//   minWall (mm)               feeds pre-export safety gate
//   density (g/mm³)            for mass estimate (value × 1e-3 = g/cm³)
//   cost ($/g printed)         rough 2024 service-bureau midpoint
//   label/slug                 UI text and STL filename slug
//   group                      'metal' | 'plastic' — drives <optgroup>
const MATERIALS = {
  // Metals — DMLS/SLM service-bureau pricing
  stainless: { label: 'Stainless Steel (316L)', slug: 'stainless', group: 'metal',   color: 0xc0c5cc, metalness: 0.90, roughness: 0.30, minWall: 0.4, density: 7.99e-3,  cost: 1.00  },
  titanium:  { label: 'Titanium (Ti-6Al-4V)',   slug: 'titanium',  group: 'metal',   color: 0x9ea2a4, metalness: 0.85, roughness: 0.40, minWall: 0.5, density: 4.43e-3,  cost: 5.00  },
  aluminum:  { label: 'Aluminum (AlSi10Mg)',    slug: 'aluminum',  group: 'metal',   color: 0xcfd5da, metalness: 0.85, roughness: 0.45, minWall: 0.5, density: 2.67e-3,  cost: 2.00  },
  inconel:   { label: 'Inconel 718',            slug: 'inconel',   group: 'metal',   color: 0xb5a692, metalness: 0.85, roughness: 0.35, minWall: 0.5, density: 8.22e-3,  cost: 7.00  },
  cocr:      { label: 'Cobalt-Chrome',          slug: 'cocr',      group: 'metal',   color: 0xb8bcc4, metalness: 0.95, roughness: 0.25, minWall: 0.4, density: 8.40e-3,  cost: 10.00 },
  bronze:    { label: 'Bronze',                 slug: 'bronze',    group: 'metal',   color: 0xa97142, metalness: 0.90, roughness: 0.30, minWall: 0.5, density: 8.80e-3,  cost: 3.00  },
  copper:    { label: 'Copper (CuCr1Zr)',       slug: 'copper',    group: 'metal',   color: 0xb87333, metalness: 0.95, roughness: 0.25, minWall: 0.6, density: 8.89e-3,  cost: 7.00  },
  // Plastics — FDM/SLA/SLS pricing.
  pla:       { label: 'PLA (FDM)',              slug: 'pla',       group: 'plastic', color: 0xe6e8eb, metalness: 0.00, roughness: 0.55, minWall: 0.8, density: 1.24e-3,  cost: 0.10  },
  petg:      { label: 'PETG (FDM)',             slug: 'petg',      group: 'plastic', color: 0xc8d4e0, metalness: 0.00, roughness: 0.45, minWall: 0.8, density: 1.27e-3,  cost: 0.12  },
  abs:       { label: 'ABS (FDM)',              slug: 'abs',       group: 'plastic', color: 0xb8b8b8, metalness: 0.00, roughness: 0.60, minWall: 0.8, density: 1.04e-3,  cost: 0.15  },
  nylon:     { label: 'Nylon PA12 (SLS)',       slug: 'nylon',     group: 'plastic', color: 0xeae3d4, metalness: 0.00, roughness: 0.70, minWall: 0.7, density: 1.01e-3,  cost: 0.50  },
  resin:     { label: 'Resin (SLA)',            slug: 'resin',     group: 'plastic', color: 0xd6d6da, metalness: 0.00, roughness: 0.30, minWall: 0.5, density: 1.18e-3,  cost: 0.40  },
};

const DEFAULTS = {
  seed: 1,
  complexity: 4,
  branchCount: 3,
  branchAngle: 35,
  taper: 0.60,
  trunk: 6.0,
  smooth: 0.25,
  poly: 0.4,
  rings: 2,
  ringGap: 0.7,
  sym: 'radial',

function makeLabelSprite() {

function setLabelText(lbl, text, cssColor) {

function updateRulers() {
  const box = new THREE.Box3().setFromObject(exportGroup);
  if (box.isEmpty()) { rulersGroup.visible = false; return; }
  rulersGroup.visible = true;
  const min = box.min.clone(), max = box.max;
  const dims = { x: max.x - min.x, y: max.y - min.y, z: max.z - min.z };
  // Pull rulers off the body by a small pad so they read as annotations.
  const pad = Math.max(4, Math.min(dims.x, dims.y, dims.z) * 0.08);
  const corner = min.clone().addScalar(-pad);
  const ends = {
    x: new THREE.Vector3(corner.x + dims.x, corner.y, corner.z),
    y: new THREE.Vector3(corner.x, corner.y + dims.y, corner.z),
    z: new THREE.Vector3(corner.x, corner.y, corner.z + dims.z),
  };
  const labelScale = Math.max(10, Math.min(dims.x, dims.y, dims.z) * 0.20);
  for (const axis of ['x','y','z']) {
    const end = ends[axis];
    const pos = rulerLines[axis].geometry.getAttribute('position');
    pos.setXYZ(0, corner.x, corner.y, corner.z);
    pos.setXYZ(1, end.x, end.y, end.z);
    pos.needsUpdate = true;
    rulerLines[axis].geometry.computeBoundingSphere();
    const mid = new THREE.Vector3(
      (corner.x + end.x) * 0.5,
      (corner.y + end.y) * 0.5,
      (corner.z + end.z) * 0.5,
    );
    rulerLabels[axis].sprite.position.copy(mid);
    rulerLabels[axis].sprite.scale.set(labelScale * 2.4, labelScale * 0.6, 1);
    const hex = '#' + RULER_COLORS[axis].toString(16).padStart(6, '0');
    setLabelText(rulerLabels[axis], `${dims[axis].toFixed(0)}mm`, hex);
  }
}

// connecting its start to its end. Used as the first visible step during
// generation so the user sees the structural framework before the body
// fills in around it.
function buildSkeletonMesh(branches) {
  const positions = new Float32Array(branches.length * 6);
  for (let i = 0; i < branches.length; i++) {
    const b = branches[i];
    positions[i*6+0] = b.start.x;
    positions[i*6+1] = b.start.y;
    positions[i*6+2] = b.start.z;
    positions[i*6+3] = b.end.x;
    positions[i*6+4] = b.end.y;
    positions[i*6+5] = b.end.z;

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ---------- Generator (Chunk 2: branch graph, debug-rendered) ----------
const MIN_RADIUS = 0.5;          // mm — matches DMLS min wall thickness
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5)); // ≈ 137.5°
const LENGTH_PER_RADIUS = 6.0;   // base segment length multiplier

// Seeded PRNG — mulberry32. Deterministic across devices.
function mulberry32(seed) {
  let a = (seed >>> 0) || 1;
  return function() {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function clearExport() {
  for (let i = exportGroup.children.length - 1; i >= 0; i--) {
    const m = exportGroup.children[i];
    exportGroup.remove(m);
    if (m.geometry) m.geometry.dispose();
  }
}

// Orthonormal frame where t is the given tangent. Writes into u, v.
const _ref = new THREE.Vector3();
function buildFrame(t, u, v) {
  if (Math.abs(t.y) < 0.9) _ref.set(0, 1, 0); else _ref.set(1, 0, 0);
  u.copy(_ref).cross(t).normalize();
  v.copy(t).cross(u).normalize();
}

// Shortest distance between two 3D segments (a1→a2) and (b1→b2).
// Standard clamped-parametric solution. Returns a scalar distance.
const _d1 = new THREE.Vector3(), _d2 = new THREE.Vector3(), _rv = new THREE.Vector3();
const _cp1 = new THREE.Vector3(), _cp2 = new THREE.Vector3();
function segSegDist(a1, a2, b1, b2) {
  _d1.subVectors(a2, a1);
  _d2.subVectors(b2, b1);
  _rv.subVectors(a1, b1);
  const a = _d1.dot(_d1), e = _d2.dot(_d2), f = _d2.dot(_rv);
  let s, t;
  if (a <= 1e-9 && e <= 1e-9) return a1.distanceTo(b1);
  if (a <= 1e-9) { s = 0; t = Math.max(0, Math.min(1, f / e)); }
  else {
    const c = _d1.dot(_rv);
    if (e <= 1e-9) { t = 0; s = Math.max(0, Math.min(1, -c / a)); }
    else {
      const b = _d1.dot(_d2);
      const denom = a * e - b * b;
      s = denom !== 0 ? Math.max(0, Math.min(1, (b * f - c * e) / denom)) : 0;
      t = (b * s + f) / e;
      if (t < 0)      { t = 0; s = Math.max(0, Math.min(1, -c / a)); }
      else if (t > 1) { t = 1; s = Math.max(0, Math.min(1, (b - c) / a)); }
    }
  }
  _cp1.copy(a1).addScaledVector(_d1, s);
  _cp2.copy(b1).addScaledVector(_d2, t);
  return _cp1.distanceTo(_cp2);
}

// Build the branch graph. Returns { branches, accents }.
// Every branch is guaranteed to share its start point with its parent's end
// (or the shared origin, for root stubs), so the graph is topologically
// connected by construction. The core is a cluster of short root capsules
// radiating from origin in Fibonacci-lattice directions; their smooth-min
// union at origin fuses into a roughly-spherical core. Each root then
// recursively grows a subtree outward in 3D.
function fibonacciSphereDirections(n, phaseOffset) {
  const out = [];
  const phi = Math.PI * (3 - Math.sqrt(5)); // golden angle
  const denom = Math.max(1, n - 1);
  for (let i = 0; i < n; i++) {
    const y = 1 - (i / denom) * 2; // +1 → -1
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = phaseOffset + phi * i;
    out.push(new THREE.Vector3(Math.cos(theta) * r, y, Math.sin(theta) * r));
  }
  return out;
}

function generateStructure(s) {
  const rng = mulberry32(s.seed);
  const branches = [];
  const accents = [];

  // Core: N root stubs radiating in all 3D directions from origin.
  // Short length (~1.5 × trunk slider) so the fused overlap at origin
  // reads as a lumpy ball rather than an elongated trunk.
  const nRoots = 6 + Math.floor(rng() * 6);  // 6..11
  const coreLen = Math.max(s.trunk * 1.5, 12);
  const dirs = fibonacciSphereDirections(nRoots, rng() * Math.PI * 2);
  const rootIndex0 = branches.length;
  // Root stubs intentionally thinner than the slider value (× 0.85) so the
  // fused core reads as a compact lumpy ball rather than a fat sphere.
  const rootR0 = Math.max(MIN_RADIUS, s.trunk * 0.85);
  for (const dir of dirs) {
    const len = coreLen * (0.7 + rng() * 0.6);
    branches.push({
      start: new THREE.Vector3(0, 0, 0),
      end: new THREE.Vector3(dir.x * len, dir.y * len, dir.z * len),
      r0: rootR0,
      r1: Math.max(MIN_RADIUS, rootR0 * s.taper),
      depth: 0,
      parent: null,
      tangent: dir.clone(),
      wobble: rng() * Math.PI * 2,
    });
  }
  // Grow subtrees from each root (do this after all roots exist so
  // self-intersection repulsion can see every sibling).
  const nRootBranches = branches.length - rootIndex0;
  for (let i = 0; i < nRootBranches; i++) {
    grow(branches[rootIndex0 + i], s, rng, branches, accents);
  }

  // Recenter so the piece is origin-centered. With the symmetric fibonacci
  // roots the centroid is already near origin, but accumulated drift from
  // repulsion-retries can shift it a few mm.
  const box = new THREE.Box3();
  for (const b of branches) box.expandByPoint(b.start).expandByPoint(b.end);
  const center = box.getCenter(new THREE.Vector3());
  for (const b of branches) { b.start.sub(center); b.end.sub(center); }
  for (const a of accents) a.pos.sub(center);

  return { branches, accents };
}

const _t = new THREE.Vector3(), _u = new THREE.Vector3(), _v = new THREE.Vector3();
function grow(parent, s, rng, branches, accents) {
  if (parent.depth >= s.complexity) return;
  if (parent.r1 < MIN_RADIUS * 1.1) return;

  const N = Math.max(1, s.branchCount | 0);
  const angleRad = s.branchAngle * Math.PI / 180;

  // Leonardo's rule: parent_r² = Σ child_r². Asymmetric random weights.
  const weights = new Array(N);
  let wsum = 0;
  for (let i = 0; i < N; i++) { weights[i] = 0.6 + rng() * 0.8; wsum += weights[i]; }
  for (let i = 0; i < N; i++) weights[i] /= wsum;

  _t.copy(parent.tangent);
  buildFrame(_t, _u, _v);

  // Directional bias, pulling children radially outward from origin. Core-
  // adjacent branches feel it more; terminal tips less (so outer foliage
  // stays irregular). When parent.end is very near origin — which happens
  // at the first generation off a short root stub — fall back to the
  // parent tangent direction, preserving the root's outward heading.
  const radBlend = 0.18 * (1 - parent.depth / Math.max(1, s.complexity));
  const _bias = new THREE.Vector3();
  const pe = parent.end;
  const peLen = Math.sqrt(pe.x*pe.x + pe.y*pe.y + pe.z*pe.z);
  if (peLen > 0.5) _bias.set(pe.x / peLen, pe.y / peLen, pe.z / peLen);
  else             _bias.copy(parent.tangent);

  const azimuth0 = rng() * Math.PI * 2;

  for (let i = 0; i < N; i++) {
    const r0 = Math.max(MIN_RADIUS, Math.sqrt(parent.r1 * parent.r1 * weights[i]) * 0.97);
    if (r0 < MIN_RADIUS * 1.05) continue;
    const r1 = Math.max(MIN_RADIUS, r0 * s.taper);

    // Up to 6 attempts per child: rotate azimuth to dodge unrelated branches.
    let placed = null;
    for (let attempt = 0; attempt < 6; attempt++) {
      const phi = azimuth0 + i * GOLDEN_ANGLE + attempt * (Math.PI / 7);
      const angJitter = angleRad * (0.85 + rng() * 0.3);

      const dir = new THREE.Vector3()
        .addScaledVector(_t, Math.cos(angJitter))
        .addScaledVector(_u, Math.sin(angJitter) * Math.cos(phi))
        .addScaledVector(_v, Math.sin(angJitter) * Math.sin(phi));

      dir.addScaledVector(_bias, radBlend).normalize();

      const length = r0 * LENGTH_PER_RADIUS * (0.75 + rng() * 0.5);
      const end = parent.end.clone().addScaledVector(dir, length);

      // Self-intersection repulsion against non-ancestor branches.
      const clearance = s.neg + r0;
      let ok = true;
      for (let j = 0; j < branches.length; j++) {
        const b = branches[j];
        if (b === parent) continue;
        // Shared-endpoint branches (siblings/parent siblings) are fine; skip
        // the check only when segments share an exact endpoint.
        if (b.end.equals(parent.end) || b.start.equals(parent.end)) continue;
        const d = segSegDist(parent.end, end, b.start, b.end);
        if (d < clearance + Math.max(b.r0, b.r1)) { ok = false; break; }
      }
      if (ok) { placed = { dir, end, length }; break; }
    }

    if (!placed) continue;

    const child = {
      start: parent.end.clone(),
      end: placed.end,
      r0, r1,
      depth: parent.depth + 1,
      parent,
      tangent: placed.dir.clone(),
      wobble: rng() * Math.PI * 2,
    };
    branches.push(child);
    grow(child, s, rng, branches, accents);
  }

  // Polyhedral accent at the junction, probabilistic on density slider.
  if (parent.depth > 0 && rng() < s.poly * 0.85) {
    accents.push({
      pos: parent.end.clone(),
      size: parent.r1 * (1.3 + rng() * 0.6),
      axis: parent.tangent.clone(),
      kind: rng() < 0.5 ? 'octa' : 'tetra',
      spin: rng() * Math.PI * 2,
    });
  }
}

  0xf00,0xe09,0xd03,0xc0a,0xb06,0xa0f,0x905,0x80c,0x70c,0x605,0x50f,0x406,0x30a,0x203,0x109,0x0,
]);

// Cube corner layout (Paul Bourke convention):
//   0:(0,0,0) 1:(1,0,0) 2:(1,1,0) 3:(0,1,0)
//   4:(0,0,1) 5:(1,0,1) 6:(1,1,1) 7:(0,1,1)
// Edge i runs from corner MC_EA[i] to MC_EB[i].
const MC_CX = new Int8Array([0,1,1,0,0,1,1,0]);
const MC_CY = new Int8Array([0,0,1,1,0,0,1,1]);
const MC_CZ = new Int8Array([0,0,0,0,1,1,1,1]);
const MC_EA = new Int8Array([0,1,2,3,4,5,6,7,0,1,2,3]);
const MC_EB = new Int8Array([1,2,3,0,5,6,7,4,4,5,6,7]);

// Extract an iso-surface (iso=0 for SDFs) from a scalar field.
// Emits a non-indexed BufferGeometry with position only; caller welds + normals.
// Convention: field[i] < iso ⇒ inside. We emit each triangle as (e0, e2, e1)
// instead of (e0, e1, e2) because three.js's MC triTable is wound CW from
// outside; swapping the last two vertices flips to CCW so computeVertexNormals
// produces outward-facing normals and back-face culling keeps the outside
// visible instead of the inside (bug fixed in v1.0.1).
function marchingCubes(field, nx, ny, nz, ox, oy, oz, vs, iso) {
  const strideZ = nx * ny;
  const positions = [];
  const edge = new Float32Array(36);
  const vv = new Float32Array(8);
  for (let z = 0; z < nz - 1; z++) {
    for (let y = 0; y < ny - 1; y++) {
      const rowBase = z * strideZ + y * nx;
      for (let x = 0; x < nx - 1; x++) {
        const i0 = rowBase + x;
        vv[0] = field[i0];
        vv[1] = field[i0 + 1];
        vv[2] = field[i0 + 1 + nx];
        vv[3] = field[i0 + nx];
        vv[4] = field[i0 + strideZ];
        vv[5] = field[i0 + 1 + strideZ];
        vv[6] = field[i0 + 1 + nx + strideZ];
        vv[7] = field[i0 + nx + strideZ];
        let ci = 0;
        if (vv[0] < iso) ci |= 1;
        if (vv[1] < iso) ci |= 2;
        if (vv[2] < iso) ci |= 4;
        if (vv[3] < iso) ci |= 8;
        if (vv[4] < iso) ci |= 16;
        if (vv[5] < iso) ci |= 32;
        if (vv[6] < iso) ci |= 64;
        if (vv[7] < iso) ci |= 128;
        const ef = MC_EDGE_TABLE[ci];
        if (ef === 0) continue;
        for (let e = 0; e < 12; e++) {
          if (ef & (1 << e)) {
            const a = MC_EA[e], b = MC_EB[e];
            const va = vv[a], vb = vv[b];
            let t = (iso - va) / (vb - va);
            if (!isFinite(t)) t = 0.5;
            else if (t < 0) t = 0;
            else if (t > 1) t = 1;
            const ax = x + MC_CX[a], ay = y + MC_CY[a], az = z + MC_CZ[a];
            const bx = x + MC_CX[b], by = y + MC_CY[b], bz = z + MC_CZ[b];
            edge[e*3]   = ox + vs * (ax + (bx - ax) * t);
            edge[e*3+1] = oy + vs * (ay + (by - ay) * t);
            edge[e*3+2] = oz + vs * (az + (bz - az) * t);
          }
        }
        const tb = ci * 16;
        for (let i = 0; i < 16; i += 3) {
          const e0 = MC_TRI_TABLE[tb + i];
          if (e0 === -1) break;
          const e1 = MC_TRI_TABLE[tb + i + 1];
          const e2 = MC_TRI_TABLE[tb + i + 2];
          positions.push(
            edge[e0*3], edge[e0*3+1], edge[e0*3+2],
            edge[e2*3], edge[e2*3+1], edge[e2*3+2],
            edge[e1*3], edge[e1*3+1], edge[e1*3+2],
          );
        }
      }
    }
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  return geom;
}

// ---------- SDF primitives (Chunk 3c) ----------
// Polynomial smooth-min (Inigo Quilez). k is the blend radius in field
// units; k → 0 reduces to plain min. For k > 0 the result is ≤ min(a,b),
// producing a smooth fillet between two SDFs wherever they're within k.
function smin(a, b, k) {
  if (k <= 1e-6) return a < b ? a : b;
  const h = Math.max(0, k - Math.abs(a - b)) / k;
  return (a < b ? a : b) - h * h * k * 0.25;
}

// Signed distance to a cone-capsule: line segment a→b with endpoint radii
// ra, rb. Radius interpolates linearly from ra→rb along the segment, plus
// a per-branch organic wobble (two sine components at different frequencies,
// phase-seeded by `wobble`). The wobble breaks the "perfect cylinder" look
// — gives branches subtle bulges and pinches along their length.
function sdConeCapsule(px, py, pz, ax, ay, az, bx, by, bz, ra, rb, wobble) {
  const bax = bx - ax, bay = by - ay, baz = bz - az;
  const l2 = bax * bax + bay * bay + baz * baz || 1e-9;
  const pax = px - ax, pay = py - ay, paz = pz - az;
  let h = (pax * bax + pay * bay + paz * baz) / l2;
  if (h < 0) h = 0; else if (h > 1) h = 1;
  let r = ra + (rb - ra) * h;
  const w1 = Math.sin(wobble + h * 6.2831853);
  const w2 = Math.sin(wobble * 2.3 + h * 11.0);
  r *= 1 + 0.10 * w1 + 0.05 * w2;
  const dx = pax - bax * h, dy = pay - bay * h, dz = paz - baz * h;
  return Math.sqrt(dx * dx + dy * dy + dz * dz) - r;
}

// Local-space octahedron SDF (axis-aligned at origin, half-extent s).
// Caller transforms world p → local via a dot-product frame before calling.
function sdOctahedron(lx, ly, lz, s) {
  return (Math.abs(lx) + Math.abs(ly) + Math.abs(lz) - s) * 0.57735026;
}

// Local-space tetrahedron SDF. Approximate; sharp at the four faces, soft
// everywhere else. Good enough as an aesthetic accent.
function sdTetrahedron(lx, ly, lz, s) {
  const t1 = Math.abs(lx + ly) - lz;
  const t2 = Math.abs(lx - ly) + lz;
  return (Math.max(t1, t2) - s) * 0.57735026;
}

// ---------- Field builder + body mesh (Chunk 3c) ----------
// Scatter-rasterize every primitive into its own AABB in a shared scalar
// field. Branches use smooth-min with k proportional to radius × depth
// (sharper at trunk, softer at tips); accents use hard min so polyhedral
// facets stay crisp against the organic body.
const _fu = new THREE.Vector3(), _fv = new THREE.Vector3();
const _sizeV = new THREE.Vector3();

// ---------- Negative-space paths (Chunk D / v1.6.0) ----------
// Generate polyline paths for the selected negative-space style. Each path
// is a list of { x, y, z } vertices plus a common tube radius. carveNegPaths
// then rasterizes each segment into the shared SDF field via SDF subtraction
// (result = max(body, -tubeSDF)). Both styles enter and exit the body at
// existing surface points so there's never a sealed cavity.

function negTubeRadius(s) {
  const mat = MATERIALS[s.material] || MATERIALS.stainless;
  // Scales with sculpture size and density. At the default size=80mm and
  // density=0.5 this gives ~7mm radius (14mm-wide channels) — enough to
  // actually read as negative space rather than a capillary. Absolute
  // floor is 1.5 × minWall so printability is preserved at density=0.
  const sizeFactor = s.size / 80;
  const r = (2 + 10 * s.negDensity) * sizeFactor;
  return Math.max(1.5 * mat.minWall, r);
}

function helixPaths(branches, s, rng) {
  const N = Math.max(1, Math.min(6, s.negStrands | 0));
  const box = new THREE.Box3();
  for (const b of branches) box.expandByPoint(b.start).expandByPoint(b.end);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  // Pick the longest axis for the helix's central direction and the two
  // remaining axes for its perpendicular wrap plane.
  let d = [0,0,0], p1 = [1,0,0], p2 = [0,0,1], alongLen = size.y;
  if (size.y >= size.x && size.y >= size.z)      { d = [0,1,0]; p1 = [1,0,0]; p2 = [0,0,1]; alongLen = size.y; }
  else if (size.x >= size.z)                      { d = [1,0,0]; p1 = [0,1,0]; p2 = [0,0,1]; alongLen = size.x; }
  else                                            { d = [0,0,1]; p1 = [1,0,0]; p2 = [0,1,0]; alongLen = size.z; }
  // Wrap radius and turn count scale with density slider. Wrap is up to
  // 55% of the smallest perpendicular extent so the helix takes bold
  // swings through the core rather than a tight central spindle.
  const perp = Math.min(size.x, size.y, size.z);
  const wrapR = perp * (0.30 + 0.25 * s.negDensity);
  const turns = 2 + 4 * s.negDensity;
  const tubeR = negTubeRadius(s);
  const L = alongLen * 1.15;            // extend ±7.5% past each end so tube exits cleanly
  const M = 64;                          // samples per strand (denser for fat tubes)
  const paths = [];
  for (let k = 0; k < N; k++) {
    const phase = (2 * Math.PI * k) / N + rng() * 0.05;
    const pts = new Array(M + 1);
    for (let i = 0; i <= M; i++) {
      const t = i / M;
      const along = (t - 0.5) * L;
      const ang = turns * 2 * Math.PI * t + phase;
      const rc = Math.cos(ang) * wrapR;
      const rs = Math.sin(ang) * wrapR;
      pts[i] = {
        x: center.x + along * d[0] + p1[0] * rc + p2[0] * rs,
        y: center.y + along * d[1] + p1[1] * rc + p2[1] * rs,
        z: center.z + along * d[2] + p1[2] * rc + p2[2] * rs,
      };
    }
    paths.push({ points: pts, tubeR });
  }
  return paths;
}

function colonyPaths(branches, s, rng) {
  // Need at least two off-trunk tips to connect. If the graph is too
  // shallow we bail out quietly.
  const tips = branches.filter(b => b.depth > 0);
  if (tips.length < 2) return [];
  const N = Math.max(1, Math.min(6, s.negStrands | 0));
  const tubeR = negTubeRadius(s);
  const box = new THREE.Box3();
  for (const b of branches) box.expandByPoint(b.start).expandByPoint(b.end);
  const size = box.getSize(new THREE.Vector3());
  const diag = Math.sqrt(size.x*size.x + size.y*size.y + size.z*size.z);
  // Wander scale: how far intermediate waypoints drift off the direct
  // A→B line. Bigger density = more meandering tunnels.
  const wander = diag * (0.06 + 0.14 * s.negDensity);
  // Number of waypoints (including endpoints). More density = more bends.
  const nWay = 4 + Math.floor(s.negDensity * 4);  // 4..8 waypoints
  // Smooth each wander-walk with Catmull-Rom so the carved tunnel curves
  // rather than looking like faceted line segments.
  const samplesPerSeg = 12;
  const paths = [];
  for (let k = 0; k < N; k++) {
    const iA = Math.floor(rng() * tips.length);
    let iB = Math.floor(rng() * tips.length);
    if (iB === iA) iB = (iB + 1) % tips.length;
    const A = tips[iA].end, B = tips[iB].end;
    // Build waypoints: linearly interpolate then perturb interior points.
    const way = [{ x: A.x, y: A.y, z: A.z }];
    for (let j = 1; j < nWay - 1; j++) {
      const t = j / (nWay - 1);
      way.push({
        x: A.x + (B.x - A.x) * t + (rng() - 0.5) * 2 * wander,
        y: A.y + (B.y - A.y) * t + (rng() - 0.5) * 2 * wander,
        z: A.z + (B.z - A.z) * t + (rng() - 0.5) * 2 * wander,
      });
    }
    way.push({ x: B.x, y: B.y, z: B.z });
    // Catmull-Rom through waypoints (endpoint-duplicated so first/last
    // segments have proper tangents without introducing extra control
    // points).
    const ctrl = [way[0], ...way, way[way.length - 1]];
    const pts = [];
    for (let i = 0; i < way.length - 1; i++) {
      const p0 = ctrl[i], p1 = ctrl[i+1], p2 = ctrl[i+2], p3 = ctrl[i+3];
      const steps = i === way.length - 2 ? samplesPerSeg + 1 : samplesPerSeg;
      for (let j = 0; j < steps; j++) {
        const t = j / samplesPerSeg;
        const t2 = t * t, t3 = t2 * t;
        const a = -0.5*t3 + t2 - 0.5*t;
        const b =  1.5*t3 - 2.5*t2 + 1;
        const c = -1.5*t3 + 2*t2 + 0.5*t;
        const d =  0.5*t3 - 0.5*t2;
        pts.push({
          x: a*p0.x + b*p1.x + c*p2.x + d*p3.x,
          y: a*p0.y + b*p1.y + c*p2.y + d*p3.y,
          z: a*p0.z + b*p1.z + c*p2.z + d*p3.z,
        });
      }
    }
    paths.push({ points: pts, tubeR });
  }
  return paths;
}

function generateNegPaths(branches, s, rng) {
  if (s.negStyle === 'helix')  return helixPaths(branches, s, rng);
  if (s.negStyle === 'colony') return colonyPaths(branches, s, rng);
  return [];
}

// ---------- Inner links (Chunk v1.9.0) ----------
// Decorative + structural meandering material struts between random pairs
// of branch tips, routed through the interior. Returns a flat list of
// cone-capsule segments (same shape as branches) suitable for direct
// rasterization through buildField's postCarve slot — each segment carries
// its own wobble for organic radius modulation, and adjacent segments
// share endpoint radii so the strut reads as a continuous tube.
//
// Always added (regardless of connectivity) so the inner cavity has a
// network of organic struts visible through any neg-space carving. They
// also opportunistically reconnect any thin branch that the neg-space
// carve would otherwise have severed — the auto-repair bridges then only
// fire for residual disconnects.
function generateInnerLinks(branches, s, rng) {
  const N = Math.max(0, Math.min(12, s.innerLinks | 0));
  if (N === 0) return [];
  // Prefer off-trunk tips so links emerge from "branch-like" anchors;
  // fall back to root branches if the graph is too shallow.
  let tips = branches.filter(b => b.depth > 0);
  if (tips.length < 2) tips = branches;
  if (tips.length < 2) return [];

  const mat = MATERIALS[s.material] || MATERIALS.stainless;
  // Strut radius scales with size so links read at the sculpture's scale.
  // Floor at 1.5 × minWall keeps each strut printable in the active alloy.
  const baseR = Math.max(mat.minWall * 1.5, s.size / 50);
  const out = [];

  for (let k = 0; k < N; k++) {
    const iA = Math.floor(rng() * tips.length);
    let iB = Math.floor(rng() * tips.length);
    if (iB === iA) iB = (iB + 1) % tips.length;
    const A = tips[iA].end, B = tips[iB].end;

    // Meandering waypoints with offset toward the interior. Wander scales
    // with link length so longer links curve more visibly.
    const dist = A.distanceTo(B);
    const wander = dist * 0.30;
    const nWay = 5 + Math.floor(rng() * 4);   // 5..8 waypoints
    const way = [{ x: A.x, y: A.y, z: A.z }];
    for (let j = 1; j < nWay - 1; j++) {
      const t = j / (nWay - 1);
      way.push({
        x: A.x + (B.x - A.x) * t + (rng() - 0.5) * 2 * wander,
        y: A.y + (B.y - A.y) * t + (rng() - 0.5) * 2 * wander,
        z: A.z + (B.z - A.z) * t + (rng() - 0.5) * 2 * wander,
      });
    }
    way.push({ x: B.x, y: B.y, z: B.z });

    // Catmull-Rom smoothing through the waypoints (endpoint duplicated so
    // first and last segments have well-defined tangents).
    const ctrl = [way[0], ...way, way[way.length - 1]];
    const samplesPerSeg = 6;
    const pts = [];
    for (let i = 0; i < way.length - 1; i++) {
      const p0 = ctrl[i], p1 = ctrl[i+1], p2 = ctrl[i+2], p3 = ctrl[i+3];
      const steps = i === way.length - 2 ? samplesPerSeg + 1 : samplesPerSeg;
      for (let j = 0; j < steps; j++) {
        const t = j / samplesPerSeg;
        const t2 = t * t, t3 = t2 * t;
        const a = -0.5*t3 + t2 - 0.5*t;
        const b =  1.5*t3 - 2.5*t2 + 1;
        const c = -1.5*t3 + 2*t2 + 0.5*t;
        const d =  0.5*t3 - 0.5*t2;
        pts.push({
          x: a*p0.x + b*p1.x + c*p2.x + d*p3.x,
          y: a*p0.y + b*p1.y + c*p2.y + d*p3.y,
          z: a*p0.z + b*p1.z + c*p2.z + d*p3.z,
        });
      }
    }

    // Per-vertex radius with seeded jitter, then per-segment uses adjacent
    // radii so the strut tapers smoothly along its length. Floor at minWall.
    const ptsR = pts.map(() => Math.max(mat.minWall, baseR * (0.7 + rng() * 0.6)));
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i+1];
      const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      const len = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
      out.push({
        start: new THREE.Vector3(a.x, a.y, a.z),
        end:   new THREE.Vector3(b.x, b.y, b.z),
        r0: ptsR[i],
        r1: ptsR[i+1],
        depth: 0,
        parent: null,
        tangent: new THREE.Vector3(dx/len, dy/len, dz/len),
        wobble: rng() * Math.PI * 2,
      });
    }
  }
  return out;
}

function carveNegPaths(field, nx, ny, nz, ox, oy, oz, voxel, paths) {
  const stride = nx * ny;
  for (const path of paths) {
    const pts = path.points;
    const r = path.tubeR;
    const pad = r + voxel * 2;
    for (let k = 0; k < pts.length - 1; k++) {
      const a = pts[k], b = pts[k+1];
      const xmin = Math.max(0,      Math.floor((Math.min(a.x, b.x) - pad - ox) / voxel));
      const xmax = Math.min(nx - 1, Math.ceil ((Math.max(a.x, b.x) + pad - ox) / voxel));
      const ymin = Math.max(0,      Math.floor((Math.min(a.y, b.y) - pad - oy) / voxel));
      const ymax = Math.min(ny - 1, Math.ceil ((Math.max(a.y, b.y) + pad - oy) / voxel));
      const zmin = Math.max(0,      Math.floor((Math.min(a.z, b.z) - pad - oz) / voxel));
      const zmax = Math.min(nz - 1, Math.ceil ((Math.max(a.z, b.z) + pad - oz) / voxel));
      const bax = b.x - a.x, bay = b.y - a.y, baz = b.z - a.z;
      const l2 = bax*bax + bay*bay + baz*baz || 1e-9;
      for (let zi = zmin; zi <= zmax; zi++) {
        const pz = oz + zi * voxel;
        for (let yi = ymin; yi <= ymax; yi++) {
          const py = oy + yi * voxel;
          const base = zi * stride + yi * nx;
          for (let xi = xmin; xi <= xmax; xi++) {
            const px = ox + xi * voxel;
            const pax = px - a.x, pay = py - a.y, paz = pz - a.z;
            let h = (pax*bax + pay*bay + paz*baz) / l2;
            if (h < 0) h = 0; else if (h > 1) h = 1;
            const dx = pax - bax*h, dy = pay - bay*h, dz = paz - baz*h;
            const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
            const carve = r - dist;        // = -(dist - r); positive inside tube
            const idx = base + xi;
            if (carve > field[idx]) field[idx] = carve;
          }
        }
      }
    }
  }
}

function buildField(branches, accents, s, targetVoxels = 96, postCarveBranches = []) {
  const box = new THREE.Box3();
  let maxR = 0;
  for (const b of branches) {
    box.expandByPoint(b.start);
    box.expandByPoint(b.end);
    const r = Math.max(b.r0, b.r1);
    if (r > maxR) maxR = r;
  }
  for (const a of accents) {
    box.expandByPoint(a.pos);
    if (a.size > maxR) maxR = a.size;
  }
  const pad = maxR * 2 + 4;
  box.min.addScalar(-pad);
  box.max.addScalar(pad);
  box.getSize(_sizeV);
  const maxDim = Math.max(_sizeV.x, _sizeV.y, _sizeV.z);

  const voxel = maxDim / targetVoxels;
  const nx = Math.max(8, Math.ceil(_sizeV.x / voxel) + 1);
  const ny = Math.max(8, Math.ceil(_sizeV.y / voxel) + 1);
  const nz = Math.max(8, Math.ceil(_sizeV.z / voxel) + 1);
  const ox = box.min.x, oy = box.min.y, oz = box.min.z;
  const stride = nx * ny;

  const field = new Float32Array(nx * ny * nz);
  field.fill(1e6);

  // Clamp primitive radius to at least 0.8 × voxel so thin tips don't
  // alias out of the sampling grid.
  const minR = voxel * 0.8;
  const kBase = s.smooth;

  for (const b of branches) {
    const r0 = Math.max(minR, b.r0);
    const r1 = Math.max(minR, b.r1);
    const rMax = Math.max(r0, r1);
    const depthF = b.depth / Math.max(1, s.complexity);
    // Smaller multiplier range keeps junctions crisp (less bulbous) while
    // still giving a soft fillet near tips. Halved relative to v1.1.0.
    const k = kBase * rMax * (0.2 + 0.7 * depthF);
    const pad2 = rMax + k * 2 + voxel * 2;

    const xmin = Math.max(0, Math.floor((Math.min(b.start.x, b.end.x) - pad2 - ox) / voxel));
    const xmax = Math.min(nx - 1, Math.ceil((Math.max(b.start.x, b.end.x) + pad2 - ox) / voxel));
    const ymin = Math.max(0, Math.floor((Math.min(b.start.y, b.end.y) - pad2 - oy) / voxel));
    const ymax = Math.min(ny - 1, Math.ceil((Math.max(b.start.y, b.end.y) + pad2 - oy) / voxel));
    const zmin = Math.max(0, Math.floor((Math.min(b.start.z, b.end.z) - pad2 - oz) / voxel));
    const zmax = Math.min(nz - 1, Math.ceil((Math.max(b.start.z, b.end.z) + pad2 - oz) / voxel));

    const ax = b.start.x, ay = b.start.y, az = b.start.z;
    const bx = b.end.x, by = b.end.y, bz = b.end.z;
    const bw = b.wobble || 0;

    for (let zi = zmin; zi <= zmax; zi++) {
      const pz = oz + zi * voxel;
      for (let yi = ymin; yi <= ymax; yi++) {
        const py = oy + yi * voxel;
        const rowBase = zi * stride + yi * nx;
        for (let xi = xmin; xi <= xmax; xi++) {
          const px = ox + xi * voxel;
          const d = sdConeCapsule(px, py, pz, ax, ay, az, bx, by, bz, r0, r1, bw);
          const idx = rowBase + xi;
          field[idx] = smin(field[idx], d, k);
        }
      }
    }
  }

  for (const a of accents) {
    // Build an orthonormal frame whose w-axis is the accent axis, then
    // spin it around w by a.spin. World p → local via dot products.
    buildFrame(a.axis, _fu, _fv);
    const cs = Math.cos(a.spin), sn = Math.sin(a.spin);
    const ux = _fu.x * cs + _fv.x * sn, uy = _fu.y * cs + _fv.y * sn, uz = _fu.z * cs + _fv.z * sn;
    const vx = -_fu.x * sn + _fv.x * cs, vy = -_fu.y * sn + _fv.y * cs, vz = -_fu.z * sn + _fv.z * cs;
    const wx = a.axis.x, wy = a.axis.y, wz = a.axis.z;
    const siz = Math.max(minR * 1.2, a.size);
    const pad2 = siz + voxel * 2;

    const xmin = Math.max(0, Math.floor((a.pos.x - pad2 - ox) / voxel));
    const xmax = Math.min(nx - 1, Math.ceil((a.pos.x + pad2 - ox) / voxel));
    const ymin = Math.max(0, Math.floor((a.pos.y - pad2 - oy) / voxel));
    const ymax = Math.min(ny - 1, Math.ceil((a.pos.y + pad2 - oy) / voxel));
    const zmin = Math.max(0, Math.floor((a.pos.z - pad2 - oz) / voxel));
    const zmax = Math.min(nz - 1, Math.ceil((a.pos.z + pad2 - oz) / voxel));

    const isTetra = a.kind === 'tetra';

    for (let zi = zmin; zi <= zmax; zi++) {
      const dz = oz + zi * voxel - a.pos.z;
      for (let yi = ymin; yi <= ymax; yi++) {
        const dy = oy + yi * voxel - a.pos.y;
        const rowBase = zi * stride + yi * nx;
        for (let xi = xmin; xi <= xmax; xi++) {
          const dx = ox + xi * voxel - a.pos.x;
          const lx = dx * ux + dy * uy + dz * uz;
          const ly = dx * vx + dy * vy + dz * vz;
          const lz = dx * wx + dy * wy + dz * wz;
          const d = isTetra ? sdTetrahedron(lx, ly, lz, siz) : sdOctahedron(lx, ly, lz, siz);
          const idx = rowBase + xi;
          if (d < field[idx]) field[idx] = d;
        }
      }
    }
  }

  // Hollow shell + drain bore (Chunk C). SDF shell = max(d, -(d + wall))
  // carves a cavity offset inward by `wall` mm from every surface, leaving
  // a thin walled version of the solid. The drain cylinder then subtracts
  // an infinite bore along the longest bounding-box axis through origin,
  // so DMLS unfused powder has an orientation-agnostic escape path. We
  // skip this pass entirely when wall == 0 so solid mode stays cheap.
  if (s.wall > 0.01) {
    const wall = s.wall;
    const mat = MATERIALS[s.material] || MATERIALS.stainless;
    // Drain diameter = max(2mm, 2.5 × minWall). Smaller diameters can trap
    // powder during removal; larger eats more material than needed.
    const drainR = Math.max(1.0, 1.25 * mat.minWall);
    // Pick longest axis for the bore so it has the most surface to exit
    // through and looks like an intentional through-channel.
    const sizeVec = _sizeV;  // already populated above
    let dx = 0, dy = 0, dz = 0;
    if (sizeVec.x >= sizeVec.y && sizeVec.x >= sizeVec.z) dx = 1;
    else if (sizeVec.y >= sizeVec.z)                      dy = 1;
    else                                                  dz = 1;
    for (let zi = 0; zi < nz; zi++) {
      const pz = oz + zi * voxel;
      for (let yi = 0; yi < ny; yi++) {
        const py = oy + yi * voxel;
        const base = zi * stride + yi * nx;
        for (let xi = 0; xi < nx; xi++) {
          const px = ox + xi * voxel;
          const idx = base + xi;
          const d = field[idx];
          let shell = Math.max(d, -(d + wall));
          // Cylinder SDF along axis through origin. proj = p·axis,
          // perp = p - proj·axis, dist = |perp|.
          const proj = px * dx + py * dy + pz * dz;
          const ex = px - proj * dx, ey = py - proj * dy, ez = pz - proj * dz;
          const perpDist = Math.sqrt(ex*ex + ey*ey + ez*ez);
          const cyl = perpDist - drainR;
          // Subtract cylinder: where inside cylinder (cyl < 0), push shell to outside.
          if (-cyl > shell) shell = -cyl;
          field[idx] = shell;
        }
      }
    }
  }

  // Negative-space carving (Chunk D). Independent RNG stream derived from
  // the seed keeps paths deterministic but independent of earlier streams.
  if (s.negStyle && s.negStyle !== 'none') {
    const negRng = mulberry32((s.seed >>> 0) ^ 0x112358ab);
    const paths = generateNegPaths(branches, s, negRng);
    if (paths.length) carveNegPaths(field, nx, ny, nz, ox, oy, oz, voxel, paths);
  }

  // Post-carve union-rasterize (Chunk 3d follow-up, v1.7.1). Bridge
  // capsules added by buildBodyMesh's auto-repair must survive the neg-
  // space carving that would otherwise re-sever what they just reconnected.
  // Uses hard min (not smooth-min) so the bridge reads as a thin wire
  // rather than a fat blob, and renders on top of any carving.
  for (const b of postCarveBranches) {
    const r0 = Math.max(minR, b.r0);
    const r1 = Math.max(minR, b.r1);
    const rMax = Math.max(r0, r1);
    const pad2 = rMax + voxel * 2;
    const xmin = Math.max(0,      Math.floor((Math.min(b.start.x, b.end.x) - pad2 - ox) / voxel));
    const xmax = Math.min(nx - 1, Math.ceil ((Math.max(b.start.x, b.end.x) + pad2 - ox) / voxel));
    const ymin = Math.max(0,      Math.floor((Math.min(b.start.y, b.end.y) - pad2 - oy) / voxel));
    const ymax = Math.min(ny - 1, Math.ceil ((Math.max(b.start.y, b.end.y) + pad2 - oy) / voxel));
    const zmin = Math.max(0,      Math.floor((Math.min(b.start.z, b.end.z) - pad2 - oz) / voxel));
    const zmax = Math.min(nz - 1, Math.ceil ((Math.max(b.start.z, b.end.z) + pad2 - oz) / voxel));
    const ax = b.start.x, ay = b.start.y, az = b.start.z;
    const bx = b.end.x,   by = b.end.y,   bz = b.end.z;
    const bw = b.wobble || 0;
    for (let zi = zmin; zi <= zmax; zi++) {
      const pz = oz + zi * voxel;
      for (let yi = ymin; yi <= ymax; yi++) {
        const py = oy + yi * voxel;
        const rowBase = zi * stride + yi * nx;
        for (let xi = xmin; xi <= xmax; xi++) {
          const px = ox + xi * voxel;
          const d = sdConeCapsule(px, py, pz, ax, ay, az, bx, by, bz, r0, r1, bw);
          const idx = rowBase + xi;
          if (d < field[idx]) field[idx] = d;
        }
      }
    }
  }

  return { field, nx, ny, nz, ox, oy, oz, voxel };
}

// Component centroids + sizes (Chunk B / v1.12.0). Averages vertex
// positions per component and returns the centroid of each, plus the
// vertex count (used as a cheap mass proxy). Centroids are guaranteed
// to lie inside their component for any non-degenerate convex-ish
// geometry — and for our typical sculptures they're well inside the
// body, which is exactly where the snake-vein endpoints want to be.
function componentCentroidsAndSizes(geom, vertComp, nComp) {
  const pos = geom.getAttribute('position').array;
  const V = geom.getAttribute('position').count;
  const cx = new Float32Array(nComp);
  const cy = new Float32Array(nComp);
  const cz = new Float32Array(nComp);
  const counts = new Int32Array(nComp);
  for (let i = 0; i < V; i++) {
    const c = vertComp[i];
    cx[c] += pos[i*3];
    cy[c] += pos[i*3+1];
    cz[c] += pos[i*3+2];
    counts[c]++;
  }
  const centroids = new Array(nComp);
  for (let i = 0; i < nComp; i++) {
    const k = counts[i] || 1;
    centroids[i] = { x: cx[i]/k, y: cy[i]/k, z: cz[i]/k };
  }
  return { centroids, counts };
}

// Snake-vein path (Chunk B / v1.12.0). Linear from `start` to `end`,
// perturbed perpendicular to the direction by two sinusoidal envelopes
// at different frequencies (2–4 and 3–5 cycles), each gated by sin(πt)
// so the wiggle peaks at mid-path and goes to zero at the endpoints.
// Result: a snaking 3D tendril that connects two interior points
// without going outside the implied bounding region of either.
function snakeVeinPath(start, end, rng) {
  const dxe = end.x - start.x, dye = end.y - start.y, dze = end.z - start.z;
  const len = Math.sqrt(dxe*dxe + dye*dye + dze*dze) || 1;
  const dirX = dxe / len, dirY = dye / len, dirZ = dze / len;
  // Build orthogonal frame around the direction.
  const _t = new THREE.Vector3(dirX, dirY, dirZ);
  const u = new THREE.Vector3(), v = new THREE.Vector3();
  buildFrame(_t, u, v);
  const amp = len * 0.12;                     // 12% of total span
  const n1 = 2 + rng() * 2;                   // 2–4 cycles on u
  const n2 = 3 + rng() * 2;                   // 3–5 cycles on v
  const ph1 = rng() * Math.PI * 2;
  const ph2 = rng() * Math.PI * 2;
  const M = 50;
  const pts = new Array(M + 1);
  for (let i = 0; i <= M; i++) {
    const t = i / M;
    const lx = start.x + dxe * t;
    const ly = start.y + dye * t;
    const lz = start.z + dze * t;
    const env = Math.sin(t * Math.PI);
    const a = amp * env * Math.sin(2*Math.PI * n1 * t + ph1);
    const b = amp * env * Math.cos(2*Math.PI * n2 * t + ph2);
    pts[i] = {
      x: lx + u.x * a + v.x * b,
      y: ly + u.y * a + v.y * b,
      z: lz + u.z * a + v.z * b,
    };
  }
  return pts;
}

// Interior repair vein (Chunk v1.9.2). Builds a polyline from `start` to
// `end` that dips toward origin (the body's deep interior) at mid-path,
// smooths it with Catmull-Rom, and returns it as a list of cone-capsule
// sub-segments suitable for direct rasterization through buildField's
// postCarve slot. Replaces the prior straight-line bridge that took the
// shortest path through air; this version runs through the body's
// interior so it reads as a vein, not an external strut.
function interiorBridgeSegments(start, end, s, rng, voxel) {
  const mat = MATERIALS[s.material] || MATERIALS.stainless;
  const baseR = Math.max(mat.minWall * 1.5, voxel * 1.5, 0.8);
  const nWay = 5 + Math.floor(rng() * 3); // 5..7 waypoints incl. endpoints
  const way = [{ x: start.x, y: start.y, z: start.z }];
  for (let i = 1; i < nWay - 1; i++) {
    const t = i / (nWay - 1);
    const lx = start.x + (end.x - start.x) * t;
    const ly = start.y + (end.y - start.y) * t;
    const lz = start.z + (end.z - start.z) * t;
    // Origin pull: peaks at mid-path, zero at endpoints. Forces the path
    // to dip through the body's centroid (which is at origin after
    // generateStructure's recenter) rather than going straight through air.
    const pull = 0.5 * Math.sin(t * Math.PI);
    // Lateral jitter: small random offset perpendicular-ish, larger near
    // mid-path so the vein curves organically rather than radial-symmetric.
    const j = 4 * Math.sin(t * Math.PI);
    way.push({
      x: lx * (1 - pull) + (rng() - 0.5) * 2 * j,
      y: ly * (1 - pull) + (rng() - 0.5) * 2 * j,
      z: lz * (1 - pull) + (rng() - 0.5) * 2 * j,
    });
  }
  way.push({ x: end.x, y: end.y, z: end.z });

  // Catmull-Rom smoothing (endpoint duplicated for clean tangents).
  const ctrl = [way[0], ...way, way[way.length - 1]];
  const samplesPerSeg = 6;
  const pts = [];
  for (let i = 0; i < way.length - 1; i++) {
    const p0 = ctrl[i], p1 = ctrl[i+1], p2 = ctrl[i+2], p3 = ctrl[i+3];
    const steps = i === way.length - 2 ? samplesPerSeg + 1 : samplesPerSeg;
    for (let j = 0; j < steps; j++) {
      const t = j / samplesPerSeg;
      const t2 = t * t, t3 = t2 * t;
      const a = -0.5*t3 + t2 - 0.5*t;
      const b =  1.5*t3 - 2.5*t2 + 1;
      const c = -1.5*t3 + 2*t2 + 0.5*t;
      const d =  0.5*t3 - 0.5*t2;
      pts.push({
        x: a*p0.x + b*p1.x + c*p2.x + d*p3.x,
        y: a*p0.y + b*p1.y + c*p2.y + d*p3.y,
        z: a*p0.z + b*p1.z + c*p2.z + d*p3.z,
      });
    }
  }

  // Convert to cone-capsule segments at uniform radius (organic wobble
  // skipped for repair veins — clean tubes are easier to verify visually
  // when something disconnected is being patched).
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i+1];
    const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
    const len = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
    segs.push({
      start: new THREE.Vector3(a.x, a.y, a.z),
      end:   new THREE.Vector3(b.x, b.y, b.z),
      r0: baseR, r1: baseR,
      depth: 0, parent: null,
      tangent: new THREE.Vector3(dx/len, dy/len, dz/len),
      wobble: 0,
    });
  }
  return segs;
}

// Live-preview mesh for use during the build pipeline. Clones the geom
// (cheap; ~5ms for 10k verts) so the original can be disposed by
// buildBodyMesh on the next iteration without invalidating the mesh
// the user is currently looking at. Vertex normals are computed on the
// clone so lighting is correct.
function makePreviewMesh(geom) {
  const c = geom.clone();
  c.computeVertexNormals();
  return new THREE.Mesh(c, material);
}

async function buildBodyMesh(branches, accents, s, previewVoxels = 96, parentToken, onPhase) {
  // Decorative+structural inner links are computed once up front (seeded
  // RNG, deterministic per state.seed) and passed to every retry. They
  // sit in the same post-carve slot as auto-repair bridges so they
  // survive any neg-space tunnels.
  const linkRng = mulberry32((s.seed >>> 0) ^ 0x4e54c0de);
  const innerLinks = generateInnerLinks(branches, s, linkRng);
  const bridgeRng = mulberry32((s.seed >>> 0) ^ 0x9d7e2c8a);
  const snakeRng  = mulberry32((s.seed >>> 0) ^ 0x5c69e3a1);
  const bridges = [];
  let nRepairs = 0;
  let f, geom, comp;

  // Helper: rebuild the field with current bridges, run MC, dedupe verts,
  // and re-check connectivity. Updates f/geom/comp in the closure.
  const rebuild = () => {
    const postCarve = bridges.length ? innerLinks.concat(bridges) : innerLinks;
    f = buildField(branches, accents, s, previewVoxels, postCarve);
    const raw = marchingCubes(f.field, f.nx, f.ny, f.nz, f.ox, f.oy, f.oz, f.voxel, 0);
    const rawVerts = raw.getAttribute('position').count;
    if (rawVerts === 0) { raw.dispose(); geom = null; comp = { nComp: 0, vertComp: null }; return; }
    geom = mergeVertices(raw, 1e-4);
    raw.dispose();
    comp = countComponents(geom);
  };

  // ----- Initial body build. Show it as soon as it's ready so the user
  // sees the carved/hollowed isosurface appear in place of the skeleton.
  rebuild();
  if (!geom) return { mesh: null, triCount: 0, voxel: f.voxel, nComp: 0, bridges: nRepairs };
  if (onPhase) await onPhase(
    `built isosurface — ${comp.nComp} ${comp.nComp === 1 ? 'piece' : 'pieces'}, checking connectivity…`,
    makePreviewMesh(geom)
  );

  // ----- Phase 1: nearest-pair → origin-pulled vein (v1.9.2). Cheap
  // attempts that fix most disconnects. 20 iterations is well past
  // anything seen in practice (typical: 0–2).
  const PHASE1_RETRIES = 20;
  for (let attempt = 0; comp.nComp > 1 && attempt < PHASE1_RETRIES; attempt++) {
    setProgress(`Phase 1 repair: routing vein ${attempt+1} (${comp.nComp} pieces)…`);
    await yieldFrame();
    if (parentToken != null && parentToken !== genToken) return null;
    const br = findBridge(geom, comp.vertComp, comp.nComp);
    if (!br) break;  // findBridge failure → fall through to Phase 2
    geom.dispose();
    const startV = new THREE.Vector3(br.ax, br.ay, br.az);
    const endV   = new THREE.Vector3(br.bx, br.by, br.bz);
    const segs = interiorBridgeSegments(startV, endV, s, bridgeRng, f.voxel);
    for (const seg of segs) bridges.push(seg);
    nRepairs++;
    rebuild();
    if (!geom) return { mesh: null, triCount: 0, voxel: f.voxel, nComp: 0, bridges: nRepairs };
    if (onPhase) await onPhase(
      `Phase 1 vein ${attempt+1} added — ${comp.nComp} ${comp.nComp === 1 ? 'piece' : 'pieces'} now`,
      makePreviewMesh(geom)
    );
  }

  // ----- Phase 2 (Chunk B / v1.12.0): centroid-to-largest snake veins.
  // Orthogonal repair if Phase 1 didn't converge. For each component:
  // compute its mass-weighted centroid (vertex average); the largest
  // component by vertex count is "main"; every other component connects
  // its centroid to main's centroid via a snaking polyline. Centroids
  // are guaranteed inside their own component → both endpoints are
  // interior by construction, making the path-through-interior trivial.
  // Vein radius = max(2·voxel, 2·material.minWall, 1mm) so the
  // connection cannot alias out at preview or export resolution.
  const PHASE2_RETRIES = 4;
  for (let p2 = 0; comp.nComp > 1 && p2 < PHASE2_RETRIES; p2++) {
    setProgress(`Phase 2 repair: routing snake veins centroid → main (${comp.nComp} pieces)…`);
    await yieldFrame();
    if (parentToken != null && parentToken !== genToken) return null;
    const { centroids, counts } = componentCentroidsAndSizes(geom, comp.vertComp, comp.nComp);
    let largestC = 0;
    for (let i = 1; i < comp.nComp; i++) if (counts[i] > counts[largestC]) largestC = i;
    const tgt = centroids[largestC];
    const mat = MATERIALS[s.material] || MATERIALS.stainless;
    // Phase 2 veins are intentionally slim — just enough to guarantee the
    // connection samples cleanly at preview resolution AND meets the
    // material's minWall. Earlier values were 2× both of those, which
    // filled the cavity and hid the negative space; now we use the
    // smaller of the safe floors so the body's interior remains visible
    // through any helix/colony tunnels.
    const veinR = Math.max(f.voxel * 1.0, mat.minWall * 1.0, 0.7);
    const veinsThisRound = comp.nComp - 1;
    for (let c = 0; c < comp.nComp; c++) {
      if (c === largestC) continue;
      const src = centroids[c];
      const pts = snakeVeinPath(src, tgt, snakeRng);
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i+1];
        const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
        const len = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
        bridges.push({
          start: new THREE.Vector3(a.x, a.y, a.z),
          end:   new THREE.Vector3(b.x, b.y, b.z),
          r0: veinR, r1: veinR,
          depth: 0, parent: null,
          tangent: new THREE.Vector3(dx/len, dy/len, dz/len),
          wobble: 0,
        });
      }
      nRepairs++;
    }
    geom.dispose();
    rebuild();
    if (!geom) return { mesh: null, triCount: 0, voxel: f.voxel, nComp: 0, bridges: nRepairs };
    if (onPhase) await onPhase(
      `Phase 2 round ${p2+1}: ${veinsThisRound} snake ${veinsThisRound === 1 ? 'vein' : 'veins'} added — ${comp.nComp} ${comp.nComp === 1 ? 'piece' : 'pieces'} now`,
      makePreviewMesh(geom)
    );
  }

  if (comp.nComp > 1) {
    console.warn(`buildBodyMesh: still ${comp.nComp} components after Phase 1 + Phase 2 (seed=${s.seed})`);
  }
  geom.computeVertexNormals();
  const mesh = new THREE.Mesh(geom, material);
  const triCount = geom.getIndex().count / 3;
  return { mesh, triCount, voxel: f.voxel, nComp: comp.nComp, bridges: nRepairs };
}

// Union-find on the welded index buffer. Every triangle's three verts
// must be in the same component, so unioning the pairs collapses the
// partition into one root per connected shell.
function countComponents(geom) {
  const V = geom.getAttribute('position').count;
  const idx = geom.getIndex().array;
  const parent = new Int32Array(V);
  for (let i = 0; i < V; i++) parent[i] = i;
  function find(x) {
    while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; }
    return x;
  }
  for (let i = 0; i < idx.length; i += 3) {
    const a = find(idx[i]), b = find(idx[i+1]), c = find(idx[i+2]);
    if (a !== b) parent[a] = b;
    if (b !== c) parent[b] = c;
  }
  const rootToId = new Map();
  const vertComp = new Int32Array(V);
  let nComp = 0;
  for (let i = 0; i < V; i++) {
    const r = find(i);
    let id = rootToId.get(r);
    if (id === undefined) { id = nComp++; rootToId.set(r, id); }
    vertComp[i] = id;
  }
  return { nComp, vertComp };
}

// Find the pair of vertices (one in the largest component, one in any
// other component) with minimum Euclidean distance. Brute-force but
// bounded — strays are usually small relative to the main body.
function findBridge(geom, vertComp, nComp) {
  const pos = geom.getAttribute('position').array;
  const V = geom.getAttribute('position').count;
  const buckets = [];
  for (let i = 0; i < nComp; i++) buckets.push([]);
  for (let i = 0; i < V; i++) buckets[vertComp[i]].push(i);
  let mainComp = 0;
  for (let i = 1; i < nComp; i++) if (buckets[i].length > buckets[mainComp].length) mainComp = i;
  const mainVerts = buckets[mainComp];
  let best = Infinity, bestA = -1, bestB = -1;
  for (let c = 0; c < nComp; c++) {
    if (c === mainComp) continue;
    const other = buckets[c];
    for (let i = 0; i < mainVerts.length; i++) {
      const a = mainVerts[i];
      const ax = pos[a*3], ay = pos[a*3+1], az = pos[a*3+2];
      for (let j = 0; j < other.length; j++) {
        const b = other[j];
        const dx = pos[b*3] - ax, dy = pos[b*3+1] - ay, dz = pos[b*3+2] - az;
        const d2 = dx*dx + dy*dy + dz*dz;
        if (d2 < best) { best = d2; bestA = a; bestB = b; }
      }
    }
  }
  if (bestA < 0) return null;
  return {
    ax: pos[bestA*3], ay: pos[bestA*3+1], az: pos[bestA*3+2],
    bx: pos[bestB*3], by: pos[bestB*3+1], bz: pos[bestB*3+2],
  };
}

// ---------- Ring generator (Chunk 4a) ----------
// Select branch segments whose local radius sits in a threadable band, then
// wrap each with a torus centered on the branch axis at a random parameter
// h ∈ [0.3, 0.7], with the ring axis = branch tangent + small random tilt.
// Emits as separate TorusGeometry shells — per spec this still counts as
// mechanically connected because the ring is captively interlocked (the
// stopper capture test lands in 4b).
const RING_TUBE_R = 1.0;              // mm — torus tube radius, above DMLS wall min
const RING_RADIUS_MIN = 1.0;          // mm — branches thinner than this skip ring
const RING_RADIUS_MAX = 5.0;          // mm — branches thicker than this skip ring

// Returns true if the line segA→segB actually pierces the disk defined by
// (ringCenter, ringAxis, innerR). Gates candidate selection in generateRings.
function pierceTest(segA, segB, ringCenter, ringAxis, innerR) {
  const dx = segB.x - segA.x, dy = segB.y - segA.y, dz = segB.z - segA.z;
  const num = ringAxis.x*(ringCenter.x-segA.x) + ringAxis.y*(ringCenter.y-segA.y) + ringAxis.z*(ringCenter.z-segA.z);
  const den = ringAxis.x*dx + ringAxis.y*dy + ringAxis.z*dz;
  if (Math.abs(den) < 1e-6) return false;
  const t = num / den;
  if (t < 0 || t > 1) return false;
  const px = segA.x + t*dx, py = segA.y + t*dy, pz = segA.z + t*dz;
  const rx = px - ringCenter.x, ry = py - ringCenter.y, rz = pz - ringCenter.z;
  const along = rx*ringAxis.x + ry*ringAxis.y + rz*ringAxis.z;
  const inPlaneX = rx - along*ringAxis.x;
  const inPlaneY = ry - along*ringAxis.y;
  const inPlaneZ = rz - along*ringAxis.z;
  const inPlane = Math.sqrt(inPlaneX*inPlaneX + inPlaneY*inPlaneY + inPlaneZ*inPlaneZ);
  return inPlane < innerR;
}

// Build parent→children map once per generation so capture + clearance tests
// can query neighbours in O(1).
function buildChildrenMap(branches) {
  const m = new Map();
  for (const b of branches) {
    if (!b.parent) continue;
    let arr = m.get(b.parent);
    if (!arr) { arr = []; m.set(b.parent, arr); }
    arr.push(b);
  }
  return m;
}

// Double-sided stopper capture (Chunk 4b). On each side of the ring along
// the branch axis, within distance < hole diameter (= 2·innerR), there must
// be a cross-section fatter than the hole — otherwise the ring could slide
// off that side. Junction fatness comes from siblings + parent at b.start
// and from children at b.end, fused through the SDF smooth-min.
function captureTest(b, h, innerR, childrenMap) {
  const segLen = b.start.distanceTo(b.end);
  const distStart = h * segLen;
  const distEnd = (1 - h) * segLen;
  const holeDiam = 2 * innerR;

  let startFat = b.r0;
  if (b.parent) {
    startFat = Math.max(startFat, b.parent.r1);
    const siblings = childrenMap.get(b.parent);
    if (siblings) for (const s of siblings) if (s !== b) startFat = Math.max(startFat, s.r0);
  }
  let endFat = b.r1;
  const kids = childrenMap.get(b);
  if (kids) for (const k of kids) endFat = Math.max(endFat, k.r0);

  const startOk = (distStart < holeDiam) && (startFat > innerR);
  const endOk = (distEnd < holeDiam) && (endFat > innerR);
  return startOk && endOk;
}

// Shortest distance from 3D segment a→b to point p.
function segPointDist(a, b, p) {
  const abx = b.x - a.x, aby = b.y - a.y, abz = b.z - a.z;
  const l2 = abx*abx + aby*aby + abz*abz || 1e-9;
  const apx = p.x - a.x, apy = p.y - a.y, apz = p.z - a.z;
  let t = (apx*abx + apy*aby + apz*abz) / l2;
  if (t < 0) t = 0; else if (t > 1) t = 1;
  const dx = apx - abx*t, dy = apy - aby*t, dz = apz - abz*t;
  return Math.sqrt(dx*dx + dy*dy + dz*dz);
}

// Ring-to-branch clearance. Family-connected branches (host, parent,
// siblings, children) are expected to pass near the ring by construction —
// captivity depends on them. Everyone else must stay at least (minGap)
// clear of the ring's outer tube surface.
function clearanceTest(ring, branches, minGap, childrenMap) {
  const { center, innerR, tubeR, branch: host } = ring;
  const outerR = innerR + 2 * tubeR;
  const family = new Set([host]);
  if (host.parent) {
    family.add(host.parent);
    const sib = childrenMap.get(host.parent);
    if (sib) for (const s of sib) family.add(s);
  }
  const kids = childrenMap.get(host);
  if (kids) for (const k of kids) family.add(k);
  for (const b of branches) {
    if (family.has(b)) continue;
    const bR = Math.max(b.r0, b.r1);
    const d = segPointDist(b.start, b.end, center);
    if (d < outerR + bR + minGap) return false;
  }
  return true;
}

const _ringPerp = new THREE.Vector3(), _ringBi = new THREE.Vector3();
function generateRings(branches, s, rng) {
  const rings = [];
  const targetCount = s.rings | 0;
  if (targetCount === 0) return rings;
  const candidates = branches.filter(b => {
    const rAvg = (b.r0 + b.r1) * 0.5;
    return b.depth >= 1 && rAvg >= RING_RADIUS_MIN && rAvg <= RING_RADIUS_MAX;
  });
  if (candidates.length === 0) return rings;

  // Fisher-Yates via seeded RNG for deterministic candidate order.
  const order = candidates.slice();
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }

  const childrenMap = buildChildrenMap(branches);
  const gap = Math.max(0.5, s.ringGap);
  let rejPierce = 0, rejCapture = 0, rejClearance = 0;

  for (const b of order) {
    if (rings.length >= targetCount) break;
    const h = 0.3 + rng() * 0.4;
    const cx = b.start.x + (b.end.x - b.start.x) * h;
    const cy = b.start.y + (b.end.y - b.start.y) * h;
    const cz = b.start.z + (b.end.z - b.start.z) * h;
    const center = new THREE.Vector3(cx, cy, cz);

    // Axis = branch tangent + 0..20° tilt in a random azimuth.
    buildFrame(b.tangent, _ringPerp, _ringBi);
    const tilt = (rng() * 20) * Math.PI / 180;
    const phi = rng() * Math.PI * 2;
    const axis = new THREE.Vector3()
      .copy(b.tangent).multiplyScalar(Math.cos(tilt))
      .addScaledVector(_ringPerp, Math.sin(tilt) * Math.cos(phi))
      .addScaledVector(_ringBi,  Math.sin(tilt) * Math.sin(phi))
      .normalize();

    const rAtH = b.r0 + (b.r1 - b.r0) * h;
